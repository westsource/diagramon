[package]
name = "diagramon"
description = "Diagramon —— 多格式图表编辑器（Tauri 2 跨平台外壳）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "diagramon"

[lib]
name = "diagramon_lib"
# 桌面端只经 `rlib` 被 main.rs 链接；不产出 `cdylib`/`staticlib`
# （Windows GNU 工具链下 cdylib 的导出序号会溢出，且移动端暂不在范围内）。
crate-type = ["rlib"]
# GUI 装配层不含单元测试；且其 `--test` 产物在 Windows GNU 工具链下加载即失败
# （0xc0000139，与代码无关）。行为验证走「运行应用 + 截图」，故关掉该目标的测试夹具。
# `src-tauri/tests/` 下的集成测试不受影响。
test = false

[[bin]]
name = "diagramon"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-ipc = { workspace = true }
app-core = { workspace = true }
assets = { workspace = true }
ai = { workspace = true }
platform = { workspace = true }
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
platform-windows = { workspace = true }
