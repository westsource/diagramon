[package]
name = "diagramon"
description = "Diagramon —— 多格式图表编辑器（Tauri 2 外壳，AI 为第一公民）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "diagramon"

[lib]
name = "diagramon_lib"
# 桌面端只经 `rlib` 被 main.rs 链接；不产出 cdylib/staticlib
# （Windows GNU 工具链下 cdylib 的导出序号会溢出，移动端不在范围内）。
crate-type = ["rlib"]
# 装配层不含单元测试：测试二进制链上 tauri/wry 后启动即
# STATUS_ENTRYPOINT_NOT_FOUND（WebView2 的 DLL 不在 deps 目录旁），跑不起来。
# 纯函数一律下沉到 app-core 去测；行为验证走真机自检。
test = false

[[bin]]
name = "diagramon"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-ipc = { workspace = true }
app-core = { workspace = true }
assets = { workspace = true }
ai = { workspace = true }
platform = { workspace = true }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# 与 ai crate 同一个 reqwest 版本，避免两份 TLS 栈同时链进二进制
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "charset", "http2", "stream"] }
base64 = "0.22"
notify = "8.2.0"
tauri-plugin-single-instance = "2.5.2"
xcap = "0.9.8"
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
uuid = { version = "1.28.0", features = ["v4"] }
# 令牌续期的跨 .await 锁：std MutexGuard 不是 Send，异步任务里必须用 tokio 的
# （time：clip_write_image 对剪贴板占用的短重试 sleep）
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = { version = "2.13.3", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { workspace = true }
