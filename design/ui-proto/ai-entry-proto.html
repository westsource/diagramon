<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · AI 面板入口（五档对照）</title>
<link rel="stylesheet" href="proto.css">
<style>
  /* —— 本页专属样式（其余全部走 proto.css 设计系统） —— */
  body { margin: 0; padding: 26px 32px 64px; background: var(--bg); color: var(--ink); font: var(--fs-md) var(--font-ui); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .lede { color: var(--ink-2); margin: 0 0 16px; max-width: 1180px; line-height: 1.6; }
  .lede b { color: var(--ai); }
  .lede code { font: var(--fs-xs) var(--font-mono); background: var(--surface-3); border-radius: 3px; padding: 1px 5px; }

  .vtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .vtab {
    padding: 5px 13px; font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
    text-align: left; line-height: 1.35;
  }
  .vtab small { display: block; font-size: 10px; color: var(--faint); }
  .vtab:hover { border-color: var(--ai-line); color: var(--ai); }
  .vtab.on { color: var(--ai); border-color: var(--ai-line); background: var(--ai-soft); font-weight: 600; }
  .vtab.on small { color: var(--ai); opacity: .75; }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 372px 330px; gap: 16px; align-items: start; max-width: 1500px; }
  @media (max-width: 1240px) { .stage { grid-template-columns: minmax(0, 1fr) 372px; } }
  @media (max-width: 900px) { .stage { grid-template-columns: 1fr; } }

  /* —— 左：模拟工作区（编辑器 + AI 面板） —— */
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 600px; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .editor { display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--surface); }
  .aip-code { flex: 1; padding: 10px 0; overflow: auto; font: var(--fs-sm) var(--font-mono); }
  .el { display: flex; gap: 10px; padding: 1px 12px; white-space: pre; }
  .el .ln { width: 18px; text-align: right; color: var(--faint); user-select: none; }
  .el.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .caret { display: inline-block; width: 1px; height: 13px; background: var(--ink); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  .floatbar {
    position: absolute; left: 46px; top: 120px; display: flex; gap: 2px; padding: 3px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,.13); z-index: 3;
  }
  .floatbar button { padding: 3px 10px; font-size: var(--fs-xs); color: var(--ink-2); border-radius: 999px; }
  .floatbar button:hover { background: var(--ai-soft); color: var(--ai); }

  /* —— AI 面板：结构照抄 ui/index.html —— */
  .ai-pane { border-left: 1px solid var(--border); border-top: 0; }
  .ai-tab.ovr { outline: 1px dashed var(--ai-line); outline-offset: -1px; }
  .ai-tab .ovd { font-size: 9px; margin-left: 3px; color: var(--ai); vertical-align: 2px; }
  .ai-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ai-composer { position: relative; }
  .aip-chiprow { display: flex; padding: 2px 0 6px; }

  .intent-chip {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px;
    font-size: var(--fs-xs); color: var(--ai); background: var(--ai-soft);
    border: 1px solid var(--ai-line); border-radius: 999px;
  }
  .intent-chip:hover { background: var(--surface); }
  .intent-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ai); }
  .ichip-pop {
    position: absolute; bottom: calc(100% - 4px); left: 10px; width: 246px; padding: 4px; z-index: 6;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius);
    box-shadow: 0 10px 26px rgba(0,0,0,.16);
  }
  .ichip-pop .hd { padding: 5px 8px 6px; font-size: 10px; color: var(--faint); border-bottom: 1px solid var(--border); margin-bottom: 3px; }
  .ichip-pop button { display: block; width: 100%; padding: 6px 8px; font-size: var(--fs-xs); text-align: left; border-radius: var(--radius-sm); }
  .ichip-pop button:hover { background: var(--ai-soft); }
  .ichip-pop button b { color: var(--ink); font-weight: 500; }
  .ichip-pop button small { display: block; color: var(--muted); font-size: 10px; margin-top: 1px; }

  /* —— 消息 —— */
  .msg.sys.warn .bubble { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 32%, transparent); font-weight: 500; }
  .msg-tag { font-size: 9.5px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--ai-line); color: var(--ai); background: var(--ai-soft); }
  .thumb-inline {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin-bottom: 6px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
    font-size: var(--fs-xs); color: var(--muted);
  }
  .thumb-inline .pic { width: 30px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(45deg, var(--surface-3) 0 4px, var(--surface-2) 4px 8px); border: 1px solid var(--border); }
  .att-row { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border: 1px dashed var(--ai-line); border-radius: var(--radius-sm); background: var(--ai-soft); font-size: var(--fs-xs); }
  .att-row .pic { width: 34px; height: 26px; border-radius: 3px; border: 1px solid var(--border); background: repeating-linear-gradient(45deg, var(--surface-3) 0 4px, var(--surface) 4px 8px); }
  .att-row .rm { margin-left: auto; color: var(--muted); padding: 0 3px; }
  .att-row .rm:hover { color: var(--err); }

  /* —— 右：说明卡 —— */
  .side { display: flex; flex-direction: column; gap: 12px; }
  .aip-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .aip-card > .ch { padding: 7px 12px; font-size: 10px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); background: var(--surface-inset); border-bottom: 1px solid var(--border); }
  .aip-card > .cb { padding: 10px 12px; font-size: var(--fs-sm); line-height: 1.6; }
  .aip-card .cb p { margin: 0 0 8px; color: var(--ink-2); }
  .aip-card .cb p:last-child { margin-bottom: 0; }

  .scene-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .scene-row:last-child { margin-bottom: 0; }
  .aip-sw { position: relative; width: 30px; height: 17px; flex: 0 0 auto; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background .12s; }
  .aip-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .12s; }
  .aip-sw.on { background: var(--ai); border-color: var(--ai); }
  .aip-sw.on::after { left: 15px; }
  .scene-row label { flex: 1; font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; }
  .scene-row .val { font-size: var(--fs-xs); color: var(--faint); }

  .plist { display: flex; flex-direction: column; gap: 1px; }
  .prow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; padding: 5px 12px; font-size: var(--fs-xs); align-items: baseline; }
  .prow:nth-child(odd) { background: var(--surface-inset); }
  .prow .k { color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }
  .prow .v { color: var(--ink); overflow-wrap: anywhere; }
  .prow .v em { display: block; font-style: normal; font-size: 10px; color: var(--muted); margin-top: 1px; }
  .prow.bad { background: color-mix(in srgb, var(--err-soft) 70%, transparent); }
  .prow.bad .v { color: var(--err); }
  .prow.warn { background: color-mix(in srgb, var(--warn-soft) 70%, transparent); }
  .prow.warn .v { color: var(--warn); }

  .log { max-height: 190px; overflow: auto; padding: 8px 12px; font: 11px/1.6 var(--font-mono); color: var(--ink-2); }
  .log div { padding: 1px 0; }
  .log div::before { content: "· "; color: var(--faint); }
  .log div:first-child { color: var(--ink); }
  .log .empty { color: var(--faint); font-family: var(--font-ui); }
  .log .empty::before { content: ""; }

  .tick { color: var(--ok); }
  .cross { color: var(--err); }
  ul.verdict { margin: 0; padding-left: 16px; list-style: disc; }
  ul.verdict li { margin-bottom: 4px; color: var(--ink-2); display: list-item; }
  .ai-box-row .ai-hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-line { color: var(--faint); font-size: var(--fs-xs); line-height: 1.6; }
</style>
</head>

<h1>AI 面板入口 · 五档对照</h1>
<p class="lede">
  同一个面板、同一套动作，只有「<b>谁来决定这条消息是 生成 / 改图 / 讲图 / 识图</b>」不同。
  每档都能点，右侧 <code>本条会发出去的请求</code> 是真实推导出来的 <code>intent / context / image_data_url / history</code>——<b>看那一栏的变化，比看界面快</b>。
  <br>建议剧本：<b>① 点「挂一张图」</b> → <b>② 点一下别的页签</b> → <b>③ 点发送</b>，三档走一遍即可看出差别。
</p>

<div class="vtabs" id="vtabs"></div>

<div class="stage">
  <!-- 左：模拟工作区 -->
  <div class="work" id="work">
    <div class="editor">
      <div class="pane-head">
        <span class="lbl">源码</span>
        <span class="pane-sub">登录流程.mmd</span>
        <span class="sp"></span>
        <span class="pane-sub" id="ed-mode">mermaid</span>
      </div>
      <div class="aip-code" id="code"></div>
      <div id="float-host"></div>
    </div>
    <aside class="ai-pane" id="pane"></aside>
  </div>

  <!-- 右：说明 -->
  <div class="side">
    <section class="aip-card">
      <div class="ch">场景开关</div>
      <div class="cb" id="scene"></div>
    </section>
    <section class="aip-card">
      <div class="ch">本条会发出去的请求</div>
      <div class="plist" id="payload"></div>
    </section>
    <section class="aip-card">
      <div class="ch">这一档</div>
      <div class="cb" id="verdict"></div>
    </section>
    <section class="aip-card">
      <div class="ch">操作日志</div>
      <div class="log" id="log"></div>
    </section>
  </div>
</div>

<script>
/* ============================================================================
 * 五档原型：行为差异集中在 intent 的来源与“会话归属”
 *   v0 现状    intent = 用户选的页签；4 个会话桶
 *   v1 最小    intent = 用户选的页签（挂图时本条强制识图）；1 条时间线
 *   v2 推荐    intent = 状态推导；点页签 = 覆盖这一条；1 条时间线
 *   v3 彻底    同 v2，但页签删除，意图胶囊在输入框里
 *   v4 +参考图 同 v2，且「附件 + 文档」→ review 且带图
 * ========================================================================== */

const INTENTS = {
  generate: { tab: "生图", verb: "生成新图", dir: "文 → 图", sample: "画一个用户登录流程图", reply: "已生成 mermaid：登录 → 校验 → 签发 Token。", code: true },
  vision:   { tab: "识图", verb: "看这张图", dir: "图 → 文", sample: "把它转成 mermaid", reply: "识别为 mermaid 流程：A[提交] → B{校验} → C[签发]。", code: true },
  review:   { tab: "改图", verb: "改当前图", dir: "图 → 图", sample: "把异常分支补全", reply: "已改好：补上 401 / 锁定 / 超时 三条异常分支。", code: true },
  explain:  { tab: "解图", verb: "讲这张图", dir: "图 → 文（只读）", sample: "这张图在讲什么", reply: "它在描述登录主链路：提交凭据 → 校验 → 签发 Token，失败分支只有一条 401。", code: false },
};
const ORDER = ["chat", "vision", "review", "explain"];
const TAB2INTENT = { chat: "generate", vision: "vision", review: "review", explain: "explain" };

const VARIANTS = [
  { id: "v0", name: "现状", sub: "4 页签 = 4 模式 = 4 个会话桶" },
  { id: "v1", name: "档位 1 · 最小", sub: "一个会话；页签仍是模式" },
  { id: "v2", name: "档位 2 · 推荐", sub: "页签降级为指示器" },
  { id: "v3", name: "档位 3 · 彻底", sub: "无页签 + 意图胶囊" },
  { id: "v4", name: "＋ 参考图改图", sub: "补上「附件 + 文档」的空格" },
];

const VERB = /(解释|讲讲|讲|读懂|说什么|在讲|分析|风险|流程|主链路|边界|explain|what|why|how)/i;

const S = {
  v: "v0",
  hasDoc: true,
  hasSel: false,
  att: null,          // { name, meta }
  tab: "chat",        // v0/v1：用户选的页签（v2/v3 不用）
  override: null,     // v2/v3/v4：只覆盖这一条
  q: "",
  msgs: [],
  log: [],
  pop: false,
};

/* 初始时间线：故意横跨两个页签，v0 一切页签就“少一半” */
S.msgs = [
  { role: "user", text: "画一个用户登录流程图", intent: "generate" },
  { role: "bot", text: "已生成 mermaid：登录 → 校验 → 签发 Token。", intent: "generate", code: true },
  { role: "user", text: "把失败分支补全", intent: "review" },
  { role: "bot", text: "已改好：补上 401 / 锁定 / 超时 三条异常分支。", intent: "review", code: true },
];

/* ---------------- 推导 ---------------- */

function derived() {
  if (S.att) return (S.v === "v4" && S.hasDoc) ? "review" : "vision";
  if (S.hasSel) return "review";
  if (!S.hasDoc) return "generate";
  return VERB.test(S.q) ? "explain" : "review";
}

function eff() {
  if (S.override) return S.override;
  if (S.v === "v0") return TAB2INTENT[S.tab];
  if (S.v === "v1") return S.att ? "vision" : TAB2INTENT[S.tab];
  return derived();
}

function imgSent() {
  const it = eff();
  if (it === "vision") return S.att;
  if (S.v === "v4" && it === "review" && S.att) return S.att;
  return null;
}

function ctxFor(it) {
  if (it === "review") return (S.v === "v4" && S.att) ? "文档全文 + 参考图" : "文档全文";
  if (it === "explain") return "文档全文（不吃选区）";
  if (S.hasSel) return "选区那几行";
  return "—（不带上下文）";
}

function histFor(it) {
  return S.msgs.filter((m) => m.intent === it && (m.role === "user" || m.role === "bot")).length;
}

function visible() {
  if (S.v === "v0") return S.msgs.filter((m) => m.intent === TAB2INTENT[S.tab]);
  return S.msgs;
}

/* ---------------- 动作 ---------------- */

function log(s) {
  S.log.unshift(s);
  if (S.log.length > 40) S.log.length = 40;
}

function setVariant(id) {
  S.v = id;
  S.override = null;
  S.pop = false;
  S.tab = "chat";
  S.att = null;
  S.hasSel = false;
  log("切到 " + id + "（场景重置）");
  render();
}

function attach() {
  S.att = { name: "screen-01.png", meta: "1280×720 · 已压缩 412 KB" };
  if (S.v === "v0") {
    S.tab = "vision";
    log("挂图 → 页签被自动切到「识图」：会话桶换了，上一条对话立刻不可见");
  } else if (S.v === "v1") {
    log("挂图 → 页签不动；本条强制按「识图」发送（图不会再被丢）");
  } else if (S.v === "v3") {
    S.pop = false;
    log("挂图 → 胶囊自动变成「看这张图」，对话与页签都没动");
  } else {
    log("挂图 → 高亮自动跟到「识图」，对话没动");
  }
  render();
}

function detach() {
  S.att = null;
  log("移除附件");
  render();
}

function toggleDoc() {
  S.hasDoc = !S.hasDoc;
  if (!S.hasDoc) S.hasSel = false;
  log(S.hasDoc ? "打开文档「登录流程.mmd」" : "关闭文档（无活动标签页）");
  render();
}

function toggleSel() {
  if (!S.hasDoc) return;
  S.hasSel = !S.hasSel;
  log(S.hasSel ? "选中源码第 4 行（失败分支）" : "取消选区");
  render();
}

function clickTab(id) {
  if (S.v === "v0") {
    S.tab = id;
    S.override = null;
    log("切页签「" + INTENTS[TAB2INTENT[id]].tab + "」→ 换会话桶：另一页签的对话看不见了");
  } else if (S.v === "v1") {
    S.tab = id;
    S.override = null;
    log("切页签「" + INTENTS[TAB2INTENT[id]].tab + "」→ 只换模式，对话还是一条");
  } else {
    S.override = TAB2INTENT[id];
    log("点页签 = 只覆盖这一条（发完复原），不是持久模式");
  }
  render();
}

function pickOverride(intent) {
  S.override = intent;
  S.pop = false;
  log("胶囊选择覆盖：「" + INTENTS[intent].verb + "」（只对这一条生效）");
  render();
}

function send() {
  const intent = eff();
  if (intent === "explain" && !S.hasDoc) { log("被拦下：解图需要活动文档"); render(); return; }
  if (intent === "vision" && !S.att) { log("被拦下：识图需要一张图"); render(); return; }
  const text = S.q.trim() || INTENTS[intent].sample;
  const img = imgSent();

  S.msgs.push({ role: "user", text, intent, img: img ? img.name : null });
  if (S.att && !img) {
    S.msgs.push({ role: "sys", text: "⚠ 图片没有随本条发送 —— 当前页签是「" + INTENTS[intent].tab + "」，image_data_url = null", intent });
    log("发送：image_data_url = null —— 图被静默丢弃");
  }
  S.msgs.push({ role: "bot", text: INTENTS[intent].reply, intent, code: INTENTS[intent].code });
  log("发送 → intent=" + intent + " · image=" + (img ? "有" : "null") + " · history=" + histFor(intent) + " 条");
  S.q = "";
  if (img) S.att = null;
  if (S.override) { S.override = null; log("本条覆盖已用掉，恢复自动推导"); }
  S.pop = false;
  render();
}

function clearConv() {
  S.msgs = [];
  log("清空对话（只清当前文档）");
  render();
}

/* ---------------- 渲染 ---------------- */

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function ico(id, cls) {
  return '<svg class="ico ' + (cls || "") + '" aria-hidden="true"><use href="#i-' + id + '"/></svg>';
}

function renderVtabs() {
  document.getElementById("vtabs").innerHTML = VARIANTS.map((v) =>
    '<button class="vtab' + (v.id === S.v ? " on" : "") + '" data-v="' + v.id + '">' + v.name +
    "<small>" + v.sub + "</small></button>").join("");
}

function renderEditor() {
  const lines = [
    "flowchart TD",
    "  A[提交登录] --> B{校验}",
    "  B -->|通过| C[签发]",
    "  B -->|失败| D[401]",
    "  C --> E[写会话]",
  ];
  document.getElementById("ed-mode").textContent = S.hasDoc ? "mermaid · 5 行" : "（无文档）";
  document.getElementById("code").innerHTML = S.hasDoc
    ? lines.map((t, i) => '<div class="el' + (S.hasSel && i === 3 ? " sel" : "") + '"><span class="ln">' + (i + 1) + "</span><span>" + esc(t) +
        (S.hasSel && i === 3 ? '<span class="caret"></span>' : "") + "</span></div>").join("")
    : '<div class="el" style="color:var(--faint)"><span class="ln">–</span><span>没有打开的文档</span></div>';
  document.getElementById("float-host").innerHTML = (S.v === "v3" && S.hasSel)
    ? '<div class="floatbar" id="floatbar">' +
      '<button data-fb="review">改这段</button><button data-fb="explain">讲这段</button><button data-fb="generate">问这个</button></div>'
    : "";
}

function msgNode(m) {
  if (m.role === "sys") {
    return '<div class="msg sys warn"><div class="bubble">' + esc(m.text) + "</div></div>";
  }
  const isUser = m.role === "user";
  const tag = '<span class="msg-tag">' + INTENTS[m.intent].tab + "</span>";
  const thumb = m.img
    ? '<div class="thumb-inline"><span class="pic"></span><span>' + esc(m.img) + " · 已随本条上行</span></div>"
    : "";
  const card = m.code
    ? '<div class="code-card"><div class="code-card-head">' + ico("diagram", "ico-sm") +
      '<span>login.mmd</span><span class="sp"></span><span style="color:var(--faint);font-size:10px">mermaid</span></div>' +
      '<pre>flowchart TD\n  A --&gt; B\n  B --&gt;|通过| C\n  B --&gt;|失败| D</pre>' +
      '<div class="code-card-actions"><button class="btn sm ai">应用到编辑器</button><button class="btn sm ghost">撤销</button></div></div>'
    : "";
  return '<div class="msg ' + (isUser ? "user" : "bot") + '">' +
    '<div class="msg-head"><span class="who">' + (isUser ? "你" : "Assistant") + "</span>" + tag +
    (isUser ? "" : '<span class="badge-used">gpt-4o</span>') + "</div>" +
    '<div class="bubble">' + thumb + esc(m.text) + "</div>" + card + "</div>";
}

function tabBar() {
  const it = eff();
  return ORDER.map((id) => {
    const intent = TAB2INTENT[id];
    const on = (S.v === "v0" || S.v === "v1") ? (S.tab === id) : (it === intent);
    const ovr = S.v !== "v0" && S.v !== "v1" && S.override === intent;
    return '<button class="ai-tab' + (on ? " on" : "") + (ovr ? " ovr" : "") + '" data-tab="' + id + '">' +
      INTENTS[intent].tab + (ovr ? '<span class="ovd">本条</span>' : "") + "</button>";
  }).join("");
}

function chip() {
  return '<button class="intent-chip" id="chip"><span class="dot"></span>将按「' +
    INTENTS[eff()].verb + "」发送" + ico("chev", "ico-sm") + "</button>";
}

function popPopover() {
  if (!S.pop) return "";
  return '<div class="ichip-pop" id="ichip-pop"><div class="hd">这一条按什么发？（只覆盖这一条）</div>' +
    ORDER.map((id) => {
      const k = TAB2INTENT[id], I = INTENTS[k];
      return '<button data-ovr="' + k + '"><b>' + I.verb + "</b><small>" + I.dir + " · " + I.tab + "</small></button>";
    }).join("") + "</div>";
}

function renderPane() {
  const it = eff();
  const list = visible();
  const empty = list.length === 0;
  const stream = empty
    ? '<div class="ai-empty"><div><div class="hero">' + ico("sparkles", "ico-lg") + "</div>" +
      "<h3>" + (S.v === "v0" ? "这个页签还是空的" : "说一句话开始") + "</h3>" +
      "<p>" + (S.v === "v0" ? "四个页签各自一份对话，切过来就是一片空白。" : "对话只有一条，切页签不会换。") + "</p></div></div>"
    : list.map(msgNode).join("");

  const attRow = S.att
    ? '<div class="ai-attachments"><div class="att-row"><span class="pic"></span><span>' + esc(S.att.name) +
      "<br><span style=\"color:var(--faint);font-size:10px\">" + esc(S.att.meta) + "</span></span>" +
      '<button class="rm" id="att-rm" title="移除">' + ico("close", "ico-sm") + "</button></div></div>"
    : "";

  let hint = "上下文：" + ctxFor(it);
  if (S.v === "v1" && S.att) {
    hint = "⚠ 实际按「识图」发送";
  }

  const tabsHtml = (S.v === "v0" || S.v === "v1" || S.v === "v2" || S.v === "v4")
    ? '<div class="ai-tabs" id="ai-tabs">' + tabBar() + "</div>" : "";

  const chipHtml = (S.v === "v3")
    ? chip() : "";

  document.getElementById("pane").innerHTML =
    '<div class="ai-head"><span class="ai-title">' + ico("sparkles") + "AI</span><span class=\"sp\"></span>" +
    '<button class="ai-model"><span class="dot"></span>gpt-4o' + ico("chev", "ico-sm") + "</button>" +
    '<button class="icon-btn" title="历史会话">' + ico("history", "ico-sm") + "</button>" +
    '<button class="icon-btn" title="清空对话" id="clear">' + ico("trash", "ico-sm") + "</button>" +
    '<button class="icon-btn" title="隐藏 AI 面板">' + ico("close", "ico-sm") + "</button></div>" +
    tabsHtml +
    '<div class="ai-body"><div class="ai-stream" id="stream">' + stream + "</div>" +
    '<div class="ai-composer">' + attRow +
    '<div class="ai-box"><textarea id="ta" rows="2" placeholder="' +
    (S.v === "v0" ? "描述你想要的图…" : S.v === "v1" ? "先选页签，再说话…" : "说一句话，它自己判断是画、改还是讲…") +
    '">' + esc(S.q) + "</textarea>" +
    (chipHtml ? '<div class="aip-chiprow">' + chipHtml + "</div>" : "") +
    '<div class="ai-box-row">' +
    '<button class="icon-btn" id="attach" title="添加图片">' + ico("image", "ico-sm") + "</button>" +
    '<button class="icon-btn" title="截屏识别">' + ico("scan", "ico-sm") + "</button>" +
    '<button class="icon-btn" title="把当前图作为上下文">' + ico("diagram", "ico-sm") + "</button>" +
    '<button class="icon-btn" title="选择文件作为上下文">' + ico("folder", "ico-sm") + "</button>" +
    '<span class="sp"></span><span class="ai-hint">' + esc(hint) + "</span>" +
    '<button class="send-btn" id="send" title="发送">' + ico("send", "ico-sm") + "</button></div></div>" +
    popPopover() + "</div></div>";

  const st = document.getElementById("stream");
  if (st) st.scrollTop = st.scrollHeight;
}

function renderScene() {
  document.getElementById("scene").innerHTML =
    '<div class="scene-row"><button class="aip-sw' + (S.hasDoc ? " on" : "") + '" id="sw-doc"></button>' +
    '<label for="sw-doc">打开文档</label><span class="val">登录流程.mmd</span></div>' +
    '<div class="scene-row"><button class="aip-sw' + (S.hasSel ? " on" : "") + '" id="sw-sel"' + (S.hasDoc ? "" : " disabled") + "></button>" +
    '<label for="sw-sel">有选区（第 4 行）</label><span class="val">' + (S.hasSel ? "已选" : "无") + "</span></div>" +
    '<div class="scene-row" style="margin-top:10px">' +
    '<button class="btn sm" id="do-att">' + ico("image", "ico-sm") + " 挂一张图</button>" +
    (S.att ? '<button class="btn sm ghost" id="do-detach">移除</button>' : "") +
    '<span class="sp" style="flex:1"></span>' +
    '<button class="btn sm ghost" id="do-clear">清空对话</button></div>' +
    '<p class="note-line" style="margin-top:8px">输入框里带「解释 / 讲 / 风险 / 流程」时，' +
    (S.v === "v2" || S.v === "v3" || S.v === "v4" ? "会自动判为「解图」。" : "在现在这套里没有作用 —— 页签说了算。") + "</p>";
}

function renderPayload() {
  const it = eff();
  const img = imgSent();
  const rows = [
    { k: "intent", v: it, note: INTENTS[it].dir + ((S.v === "v1" && S.att) ? " · 页签停在「" + INTENTS[TAB2INTENT[S.tab]].tab + "」，本条却按识图发" : "") },
    { k: "context", v: ctxFor(it), note: S.hasSel && it === "review" ? "选区作为「只改这一段」的说明一并发出" : "" },
    {
      k: "image_data_url", v: img ? "有（" + img.name + "）" : "null",
      note: img ? "图随本条上行" : (S.att ? "挂着的图不会上行" : ""),
      sev: S.att && !img ? "bad" : "",
    },
    { k: "history", v: histFor(it) + " 条", note: S.v === "v0" ? "只取当前页签的桶" : "全时间线里属于该 intent 的轮次" },
  ];
  document.getElementById("payload").innerHTML = rows.map((r) =>
    '<div class="prow ' + (r.sev || "") + '"><span class="k">' + r.k + "</span><span class=\"v\">" +
    esc(r.v) + (r.note ? "<em>" + esc(r.note) + "</em>" : "") + "</span></div>").join("");
}

const VERDICT = {
  v0: {
    what: "不改 —— 这是今天的实现（ui/js/ai.js）。",
    win: [],
    lose: [
      "挂图自动换页签 → 会话桶跟着换，上一条对话立刻不见",
      "在别的页签挂图 → image_data_url 静默变 null，图没发出去也没提示",
      "切页签 = 换一份对话，用户以为 AI 忘了",
      "默认停哪个页签靠“有没有文档”猜，猜完还要用户自己确认",
    ],
  },
  v1: {
    what: "4 个会话桶 → 1 条时间线；挂图不切页签，且这一条强制按识图发；页签名改动词。",
    win: ["切页签不再失忆", "图不会再被静默丢弃"],
    lose: [
      "页签仍是持久模式：想“新画一张”得先切回生图，忘了就是改坏了当前文档",
      "默认高亮不会自己动，用户仍要判断选得对不对",
    ],
  },
  v2: {
    what: "intent 由状态推导（有图→识图 / 有选区→改这段 / 有文档→改或讲 / 无文档→生成）；点页签 = 只覆盖这一条，发完复原。",
    win: ["四条全消", "默认永远对：挂图、选选区、关文档，高亮自己跟过去", "覆盖是“这一条”，不会把错误状态带到下一句"],
    lose: ["附件与文档仍互斥 —— “照这张截图改我现在这张图”没有入口（见第 5 个页签）"],
  },
  v3: {
    what: "在 v2 基础上删掉页签：意图显示在输入框左下角，点开可覆盖；有选区时出现浮动工具条。",
    win: ["与 v2 相同，但入口离发送键更近", "少一行 UI，面板更安静"],
    lose: ["改动量约为 v2 的 8–10 倍（ai.js 约 26 处引用 + 4 条探针断言 + i18n）"],
  },
  v4: {
    what: "在 v2 上补「附件 + 文档」这一格：挂图且有文档 → intent=review，且图随本条上行。",
    win: ["“照这张截图改我现在这张图”终于有入口", "参数早就分开了（image_data_url / context / files），不用改 IPC"],
    lose: [],
  },
};

function renderVerdict() {
  const d = VERDICT[S.v];
  const li = (a) => a.length ? '<ul class="verdict">' + a.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="note-line">—</p>';
  document.getElementById("verdict").innerHTML =
    "<p>" + esc(d.what) + "</p>" +
    "<p><b>消掉</b></p>" + li(d.win) +
    "<p style=\"margin-top:8px\"><b>还留着</b></p>" + li(d.lose);
}

function renderLog() {
  const el = document.getElementById("log");
  el.innerHTML = S.log.length
    ? S.log.map((x) => "<div>" + esc(x) + "</div>").join("")
    : '<div class="empty">点上面的开关或按钮，这里会记录每一步的后果。</div>';
}

function render() {
  renderVtabs();
  renderEditor();
  renderPane();
  renderScene();
  renderPayload();
  renderVerdict();
  renderLog();
}

/* ---------------- 事件 ---------------- */

document.addEventListener("click", (e) => {
  const t = e.target;

  const vt = t.closest("[data-v]");
  if (vt) { setVariant(vt.dataset.v); return; }

  const tab = t.closest("[data-tab]");
  if (tab) { clickTab(tab.dataset.tab); return; }

  const ovr = t.closest("[data-ovr]");
  if (ovr) { pickOverride(ovr.dataset.ovr); return; }

  const fb = t.closest("[data-fb]");
  if (fb) {
    S.override = fb.dataset.fb;
    log("浮动条「" + INTENTS[S.override].verb + "」→ 只覆盖这一条");
    render();
    return;
  }

  if (t.closest("#chip")) { S.pop = !S.pop; render(); return; }
  if (S.pop && !t.closest("#ichip-pop")) { S.pop = false; render(); }

  if (t.closest("#send")) return send();
  if (t.closest("#attach")) return attach();
  if (t.closest("#att-rm")) return detach();
  if (t.closest("#clear")) return clearConv();
  if (t.closest("#sw-doc")) return toggleDoc();
  if (t.closest("#sw-sel")) return toggleSel();
  if (t.closest("#do-att")) return attach();
  if (t.closest("#do-detach")) return detach();
  if (t.closest("#do-clear")) return clearConv();
});

document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "ta") {
    S.q = e.target.value;
    // 只刷新会变的几块，别重建 textarea（会丢光标）
    const nt = document.querySelector("#ai-tabs");
    if (nt) nt.innerHTML = tabBar();
    const cp = document.querySelector("#chip");
    if (cp) cp.outerHTML = chip();
    renderPayload();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && e.target && e.target.id === "ta") {
    e.preventDefault();
    send();
  }
});

/* URL 直达：?v=v2&att=1&sel=1&doc=0 */
(function init() {
  const q = new URLSearchParams(location.search);
  if (q.get("v") && VARIANTS.some((x) => x.id === q.get("v"))) S.v = q.get("v");
  if (q.get("doc") === "0") S.hasDoc = false;
  if (q.get("sel") === "1" && S.hasDoc) S.hasSel = true;
  if (q.get("att") === "1") S.att = { name: "screen-01.png", meta: "1280×720 · 已压缩 412 KB" };
  if (q.get("q")) S.q = q.get("q");
  render();
})();
</script>
</body>
</html>
