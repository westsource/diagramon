<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Diagramon drawio host</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  iframe { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!--
  这是属于 Diagramon 的资产，不是 drawio 的（见方案 §4.5 / §8.4.1）。

  为什么必须有这一层外壳页：drawio 的 embed 初始化被 `parent != window` 门控
  （js/diagramly/App.js 的 initializeEmbedMode / EditorUi.js 的消息监听），
  若把 drawio 的 index.html 直接当顶级文档载入，整段 embed 初始化会被跳过 ——
  页面看起来正常，但消息协议完全不通。因此必须由同源的 iframe 承载 drawio。

  消息通道（两个方向都不做二次 JSON 编码，载荷始终是**字符串**）：
    drawio → 外壳 : window.postMessage(JSON.stringify(msg), '*')
    外壳 → C#     : 追加进 window.__hostQueue（宿主轮询取走；队列会被清空后返回）
    C# → 外壳     : 宿主执行 window.__apply(str)
    外壳 → drawio : frame.postMessage(str, '*')
  队列同时被消费与转发是刻意的：宿主只要能执行脚本（已验证可用）就能工作，
  不依赖 WebView 包装层是否暴露消息事件。
-->
<iframe id="dl" src="./index.html?embed=1&proto=json&spin=1&noExitBtn=1&libraries=1&ui=min&noSaveBtn=1&saveAndExit=0&nav=0"></iframe>
<script>
  // 离线守卫不在这里：drawio 跑在 iframe 里，宿主页的补丁管不到它的 realm。
  // 守卫由 tools/fetch-drawio.ps1 注入到 drawio 自己的 index.html（tools/offline-guard/offline-guard.js）。
  // 刻意**不带 `configure=1`**：实测（真 drawio v31.4.6 + 本文凭页）带该参数时 drawio 会先发
  // {"event":"configure"} 并**停在那里等宿主回 action:configure**，`init` 永不到来 —— 承载层会一直
  // 空着。我们的离线加固不靠 configure 回包，而是在拉取期改 PreConfig.js（禁服务端导出 / gapi /
  // 数学渲染，见 tools/fetch-drawio.ps1），因此直接跳过这个握手。
  //
  // 同样**不带 `saveAndExit=1`**：带上它时画布里的保存会回 `{"event":"save", "exit":true}`，
  // 语义是"保存完请宿主关掉承载面"。本应用里 drawio 就是标签页的编辑器，没有"退出嵌入"这回事，
  // 因此保持普通保存语义，`noExitBtn=1` 继续把退出按钮藏掉。
  //
  // `noSaveBtn=1` 去掉画布自带的 Save 按钮（它与本应用的"保存"是同一个语义，两个入口并列
  // 只会让人怀疑哪个才算数）；**必须同时给 `saveAndExit=0`**：drawio 只在
  // `"1"==urlParams.noSaveBtn ? ("0"!=urlParams.saveAndExit && 挂一个"Save and Exit")` 这个分支里
  // 决定不放任何按钮（见 js/app.min.js 的 createEmbedButton 调用），少了 saveAndExit=0 会换出
  // 一个语义更糟的"保存并退出"。去掉按钮后"画布 → 正文"的同步由两条路保证：
  // drawio 自己的 autosave（每次改动 1.5s 后回写），以及宿主落盘前的 flush
  // （`{"action":"export","format":"xml"}`，见 DrawioDocumentHost.FlushAsync）。
  const frameElement = document.getElementById('dl');
  const frame = () => frameElement.contentWindow;

  window.__hostQueue = [];
  window.__hostState = 'awaiting-init';

  // C# → drawio
  // 入口名与 Excalidraw 承载页保持一致（`window.__apply`）：宿主侧统一用 EmbeddedProtocol.DeliverScript，
  // 两个页面若各叫各的名字（曾经这里是 `__deliver`），宿主就会把动作投到一个不存在的函数上而**静默丢失** ——
  // 表现为 drawio 永远停在 Loading。
  window.__apply = (payload) => {
    try {
      frame().postMessage(payload, '*');
      return true;
    } catch (e) {
      return false;
    }
  };

  // drawio → C#
  window.addEventListener('message', (evt) => {
    if (evt.source !== frame()) return;
    if (typeof evt.data !== 'string') return;

    try {
      const parsed = JSON.parse(evt.data);
      if (parsed && typeof parsed.event === 'string') {
        window.__hostState = parsed.event;
      }
    } catch (e) {
      // 非 JSON 载荷照样转交，由 C# 侧决定怎么处理
    }

    window.__hostQueue.push(evt.data);

    // 若宿主换用消息事件通道，这里也顺带投递一次；通道不存在时静默忽略。
    try {
      if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
        window.chrome.webview.postMessage(evt.data);
      }
    } catch (e) {
    }
  });

  // ==========================================================================
  // 一、藏掉 drawio 自己的缩放输入框（`.geZoomInput`，底部状态条右侧那个「100%」）。
  //
  // 本应用的缩放语义只有一处（状态栏的百分数 + 画布右下角的缩放条），画布内再摆一个读数
  // 就是两个数字互相打架；而 drawio 的 embed 参数里**没有**关掉它的开关（只有 urlParams.zoom
  // 设初值），只能注入样式。**隐藏 ≠ 删除**：Alt+滚轮缩放照旧可用，元素仍在 DOM 里，
  // drawio 也照常更新它的值（宿主轮询就是读它）。
  //
  // 二、`ui=min` 下 drawio 的 **Shapes / Format 面板都是浮动窗口**（mxWindow），位置在创建
  // 那一刻算一次就不再重算，于是两种翻车形态（用户 2026-10-14 报的）：
  //   a) 容器变**宽**：窗口留在旧位置不动，画布从它下面一直铺到窗口右边（实测 900 → 1500
  //      时 Format 卡在 left=658，面板浮在半空）；
  //   b) 容器变**矮/窄**：drawio 自己的"把窗口夹进容器"逻辑往上顶，撞穿顶栏
  //      （实测 620/520 高的容器里 Shapes 的 top 被顶到 0 / 18 —— 直接盖住顶栏）。
  // 这里用 CSS 钉住：顶部一律在顶栏下方、Format 贴右缘、两个窗口都不许戳出底边。
  //
  // 顶栏读数：`.geMinimal .geMenubarContainer { height: 48px; border-bottom: 1px }`
  //（grapheditor.css，box-sizing: border-box ⇒ 连边框共 48）；下面留 8px ⇒ top: 56px。
  // `max-height: calc(100% - 64px)` = 56 + 底边留 8：不夹的话顶栏刚修好、底边又戳出去
  // （面板内容自己会滚：.geFormatContainer 与形状库都带 overflow-y）。
  //
  // Format 的右缘取 **12px**，与本站画布右下角那条缩放条（app.css `.canvas-tools{right:12px}`）
  // **同口径** —— 这是一条对齐要求（用户拍的），改一处要改另一处；承载页 iframe 正好铺满
  // `.canvas-viewport`（.canvas-frame 无边框、inset:0），所以两边的 12px 是同一个 12px。
  //
  // 为什么用 CSS 钉而不是 JS 调 mxWindow.setLocation：
  //   - mxWindow 实例没法从 DOM 反查（元素上没有反向引用），只能靠 `mxWindow.activeWindow`
  //     这个"当前激活窗口"的静态去碰运气；
  //   - 只改 DOM 的 left/top 则 drawio 内部坐标（this.x/this.y，拖拽偏移就是用它算的）会落后，
  //     用户一拖窗口先跳一下；
  //   - 而 CSS 只是盖住视觉位置，内部坐标压根不参与 —— 没有"跳一下"这种事。
  // 代价（用户拍板要的就是这个语义）：这两个窗口**横竖都拖不动了**，宽度仍可拖（width 没碰）。
  // `:has()` 能用：drawio 自己的 grapheditor.css 里就有 15 处 `:has(`。
  // `.geSidebarContainer:not(.geFormatContainer)` 是 drawio 自己区分"形状库窗口"与"格式窗口"
  // 的写法（见它的 `.geEditor>.geSidebarContainer:not(.geFormatContainer)`）。
  //
  // 三、注入时机：挂在 iframe 的 load 上而不是注入一次就完事 —— drawio 内部会
  // window.location.reload()（语言/主题切换等路径），重载后注入的样式会一起消失，
  // 而 load 每次导航都会再来一次。
  // ==========================================================================
  // 三、藏掉顶栏里 drawio **自己那组缩放**（Fit / Zoom In / Zoom Out 三个图标）—— 本应用右下角
  // 已有缩放条、Ctrl+0 / Ctrl+= / Ctrl+- 也都通向承载页的 `__hostFit` / `__hostZoomBy`，
  // 画布内不该有第二份缩放入口（与上面藏掉底部「100%」输入同一个口径）。
  //
  // 定位方式：按**快捷键后缀**找父组，`> .geButton[title*="(Ctrl -)"]`。
  //   - 不能用 `:last-child` / `:nth-child`：顶栏那几组的构成会变（实测同一份参数下，有时后面
  //     还跟着「Comments / Change User」那组，顶部最右的并不总是缩放组）；
  //   - 不能用 `[title^="Zoom"]`：按钮标题跟着 drawio 的语言走（WebView2 跟随系统，多半是中文），
  //     但标题里的快捷键后缀是 `Editor.ctrlKey`（"Ctrl"，不翻译）—— 看 "Format (Ctrl+Shift+P)"
  //     就是译名 + 原样后缀，所以后缀是语言无关的那一半。
  // ==========================================================================
  const CHROME_CSS =
    '.geZoomInput{display:none !important;}' +
    'div.mxWindow:has(.geFormatContainer),' +
    'div.mxWindow:has(.geSidebarContainer:not(.geFormatContainer))' +
    '{top:56px !important;max-height:calc(100% - 64px);}' +
    'div.mxWindow:has(.geFormatContainer){left:auto !important;right:12px !important;}' +
    '.geMenubarContainer > .geButtonGroup:has(> .geButton[title*="(Ctrl -)"]){display:none !important;}';

  // ==========================================================================
  // 画布内的应用级快捷键转发。
  //
  // 画布标签页的焦点在原生 WebView 子窗口里，Avalonia 窗口级的 KeyBindings（Ctrl+S 等）收不到键 ——
  // 键先落在 WebView 的窗口过程上。因此由承载页在**捕获阶段**先看一眼，命中的组合键
  // preventDefault + stopPropagation（顺带拦住 drawio/Excalidraw 自己的同名绑定，例如
  // Excalidraw 的 Ctrl+S 会去下载场景文件），再入队回宿主由 C# 执行对应命令。
  //
  // 组合键的取值是宿主侧的词汇表（见 MainWindow.HandleCanvasHotkey）：
  //   ctrl+s / ctrl+shift+s / ctrl+o / ctrl+n / ctrl+w / ctrl+q / ctrl+0 / ctrl+zoom-in / ctrl+zoom-out
  //
  // 只转发"应用级"命令；撤销/剪切等编辑类快捷键留给画布自己（它有它自己的历史）。
  // ==========================================================================
  function normalizeHotkey(event) {
    if (!event.ctrlKey || event.altKey || event.metaKey) {
      return null;
    }

    switch (event.key) {
      case 's': case 'S': return event.shiftKey ? 'ctrl+shift+s' : 'ctrl+s';
      case 'o': case 'O': return 'ctrl+o';
      case 'n': case 'N': return 'ctrl+n';
      case 'w': case 'W': return 'ctrl+w';
      case 'q': case 'Q': return 'ctrl+q';
      case '0': return 'ctrl+0';
      case '=': case '+': return 'ctrl+zoom-in';
      case '-': case '_': return 'ctrl+zoom-out';
      default: return null;
    }
  }

  function forwardHotkeys(win) {
    if (win.__diagramonHotkeys) {
      return;
    }

    win.__diagramonHotkeys = true;
    win.addEventListener('keydown', (event) => {
      const combo = normalizeHotkey(event);
      if (!combo) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();
      window.__hostQueue.push(JSON.stringify({ event: 'hotkey', combo: combo }));
    }, true);
  }

  function installDrawioChrome() {
    try {
      const win = frame();
      const doc = win.document;
      if (!doc || !doc.head) {
        return;
      }

      if (!doc.getElementById('diagramon-chrome')) {
        const style = doc.createElement('style');
        style.id = 'diagramon-chrome';
        style.textContent = CHROME_CSS;
        doc.head.appendChild(style);
      }

      forwardHotkeys(win);
      installGraphHook();
    } catch (e) {
      // iframe 还没建文档 / 已跨源：下一次 load 再试
    }
  }

  frameElement.addEventListener('load', installDrawioChrome);
  installDrawioChrome();

  // ==========================================================================
  // 缩放比例回报（宿主每 150ms 轮询，见 EmbeddedProtocol.ZoomProbeScript）。
  //
  // 读的是底部状态条那个**已被上面藏起来**的缩放输入框：元素仍在 DOM 里、drawio 也照常更新它的值，
  // 这是拿到"画布当前缩放"最省事的一条路 —— embed 协议没有查询缩放的动作，而缩放输入之外唯一的
  // 读数 UI（工具条/菜单）在 min UI 里根本不渲染。拿不到时返回 0，宿主按"没有新值"处理。
  // ==========================================================================
  window.__hostZoom = () => {
    try {
      const input = frame().document.querySelector('.geZoomInput');
      const percent = input ? parseFloat(input.value) : NaN;
      return Number.isFinite(percent) && percent > 0 ? percent / 100 : 0;
    } catch (e) {
      return 0;
    }
  };

  // ==========================================================================
  // 应用级"适应视图"的落点（宿主执行 EmbeddedProtocol.FitScript）。
  //
  // 语义：**把所有单元格在横竖两个方向上都放进视口，尽量放大，并居中** ——
  // 与另外三个模式的"Caps / SVG 预览看清整幅图"同口径（"整幅图"= 内容，不是 drawio 的页面框）。
  //
  // 路线选择：**运行时桥（monkey-patch 抓 graph 实例）**。实测（真 drawio v31.4.6 + 本文凭页，
  // 1280×900 视口 / 画布容器 1274×725，页 850×1100，border 16）：
  //   · 旧的合成按键 Ctrl+Shift+J = `fitTwoPages`（见 js/app.min.js 的绑定表
  //     `bindAction(74,!0,"fitTwoPages",!0)`），它铺的是**两页宽**的页面框：同一份 260×70 的内容
  //     实测只有 **65%**，而且内容在页面框之外时**会被切掉**（实测 900,1200 处的单元格底边超出容器
  //     107px）。页面框与"Caps 看清整幅图"是两种语义，这里按后者。
  //   · embed 的 `{"action":"fit"}`（`fit(border,null,null,null,null,/*ignoreHeight*/!0)`）只按宽度适配：
  //     有竖方向上靠外的内容时底边仍旧切掉（实测超出 717px，即便 maxScale 给到 30）。
  //   · embed 的 `{"action":"viewbox"}` 实测**确实有效**（不是空操作），且会**居中**（实测居中偏移
  //     0.9/0.2px）、两维都适配（实测内容 1248×336 落在 1274×725 里，四周留白 13.9/12.1/194.7/194.3），
  //     但它走 `fitWindow`：**没有夹取**（实测 10×10 的单格 → 7090%），且它要求承载页先知道内容框
  //     —— 那个框只在 load/autosave 消息的 `modelBounds` 里，最长落后 1.5s。**夹取到 [0.2, 30] 这条
  //     硬要求它做不到**（rect 会被它与 graphBounds 的交集吃掉，缩小 rect 也抬不动缩放），因此不用它。
  //   · `mxGraph.prototype.fit(border, keepOrigin, margin, enabled, ignoreWidth, ignoreHeight)`
  //     （js/app.min.js:1304）是唯一的"两维都适配 + 无上限"的现成原语，并且**认
  //     `graph.minFitScale` / `graph.maxFitScale`**（实测 10×10 的单格正好停在 30×，即 3000%）；
  //     但它只适配缩放，**不带居中**（实测带滚动条的容器里它把内容顶到左上角：内容左/上留白 2.6/2.5px，
  //     右/下 36/390px），所以居中由我们按滚动量补（见 centerContent）。
  //   · 空图（内容框 0×0）：`fit()` 直接返回当前缩放、**不动视图**（实测缩放 1.0 → 1.0），
  //     所以是否"真的适配过"必须由我们先看内容框再回 true/false —— 这也是宿主唯一能分辨的凭据。
  //
  // 选它之后的实测结果（同一套场景，上面那份视口）：
  //   260×70 的内容 → **475%**（旧的页面框适配只有 65%），居中偏移 0.2/0.3px、四边都在容器里；
  //   单元格在页面框之外的那份（900,1200 处 200×80）→ 两维都在容器里（留白 340/340/18/16px），
  //   旧路线会把底边切掉 107px；10×10 的单格 → 正好停在 **30×**；20000×20000 → 正好停在 **0.2×**；
  //   空图 → 回 false 且视图一动没动。`tools/dev/canvas_probe.py` 把这四条钉成了断言。
  //
  // 为什么能拿到 graph 实例：承载页里没有 `window.editor` / `geEditor` / `ui`（grep = 0），
  // 容器元素上也没有反向引用（`container.graph` 从未赋值）。唯一的入口是**拦原型方法**，等 drawio
  // 自己调一次时把 `this` 记下来 —— 选 `getGraphBounds` 是因为它在**任何**文档载入/尺寸变化时都会
  // 被调到（`createLoadMessage` 与 `sizeDidChange` 都走它），所以"有文档就有句柄"；而它又是我们
  // 需要的那个读数本身。抓住之后立刻**卸钩**，热路径回到原样（只剩一次属性读取的代价）。
  // 这是我们自己承载页的运行时补丁，不去改 drawio 的资产（tools/drawio/** 是从钉住的源取来的）。
  // ==========================================================================
  const FIT_BORDER = 16;       // 与 drawio embed `{"action":"fit"}` 的默认 border 同值
  const FIT_MIN_SCALE = 0.2;   // 与 SVG 预览模式同口径（ui/js/preview.js 的 MIN_SCALE / MAX_SCALE）
  const FIT_MAX_SCALE = 30;

  function isEditorGraph(graph) {
    const container = graph && graph.container;
    return !!(container && container.classList
      && container.classList.contains('geDiagramContainer') && container.offsetWidth > 0);
  }

  // 抓 live graph 句柄（见上面的路线说明）。幂等：钩子只在没抓到之前挂着。
  function installGraphHook() {
    try {
      const win = frame();
      const proto = win.mxGraph && win.mxGraph.prototype;
      if (!proto || proto.getGraphBounds.__diagramonHook) {
        return;
      }

      const original = proto.getGraphBounds;
      const hooked = function () {
        const bounds = original.apply(this, arguments);
        if (!win.__diagramonGraph && isEditorGraph(this)) {
          win.__diagramonGraph = this;
          proto.getGraphBounds = original;   // 抓到手就卸钩
        }
        return bounds;
      };
      hooked.__diagramonHook = true;
      proto.getGraphBounds = hooked;
    } catch (e) {
      // iframe 还没建文档 / 已跨源：下一次 load 或下一次 __hostFit 再试
    }
  }

  function liveGraph() {
    installGraphHook();
    try {
      const win = frame();
      const graph = win.__diagramonGraph;
      // isConnected：drawio 内部 reload（语言/主题切换）后旧实例会从文档里掉出来，
      // 这时宁可这一次适配失败（宿主如实报"没适配"），也不要对死实例操作。
      return graph && graph.container && graph.container.isConnected ? graph : null;
    } catch (e) {
      return null;
    }
  }

  // fit() 只定缩放、不定位置：带滚动条的容器里它把内容顶到左上角（实测理由见上）。
  // 这里按滚动量把它摆到正中（内容比视口大时退回左上角 —— 那是夹取后必然的结果）。
  function centerContent(graph) {
    const container = graph.container;
    const bounds = graph.getGraphBounds();
    const freeX = Math.max(0, container.clientWidth - bounds.width);
    const freeY = Math.max(0, container.clientHeight - bounds.height);
    const maxLeft = Math.max(0, container.scrollWidth - container.clientWidth);
    const maxTop = Math.max(0, container.scrollHeight - container.clientHeight);

    container.scrollLeft = Math.max(0, Math.min(maxLeft, Math.round(bounds.x - freeX / 2)));
    container.scrollTop = Math.max(0, Math.min(maxTop, Math.round(bounds.y - freeY / 2)));
  }

  window.__hostFit = () => {
    try {
      const graph = liveGraph();
      if (!graph) {
        return false;
      }

      const bounds = graph.getGraphBounds();
      // 空图：fit() 会原样返回、视图一动不动，别把它报成"适配成功"。
      if (!(bounds.width > 0 && bounds.height > 0)) {
        return false;
      }

      // 夹取用的是 graph 上的两个字段，用完还回去 —— 别把 drawio 自己的 fit 路径（lightbox 等）
      // 一起夹到我们的范围里。
      const previousMin = graph.minFitScale;
      const previousMax = graph.maxFitScale;
      let scale;
      try {
        graph.minFitScale = FIT_MIN_SCALE;
        graph.maxFitScale = FIT_MAX_SCALE;
        scale = graph.fit(FIT_BORDER, false, 0, true, false, false);
      } finally {
        graph.minFitScale = previousMin;
        graph.maxFitScale = previousMax;
      }

      centerContent(graph);
      return Number.isFinite(scale) && scale > 0;
    } catch (e) {
      return false;
    }
  };

  // ==========================================================================
  // 应用级"放大 / 缩小一档"的落点（宿主执行 EmbeddedProtocol.ZoomByScript）。
  //
  // drawio 的 embed 协议没有"设缩放"的动作，所以借它自己的 Ctrl+滚轮通道：合成一个 WheelEvent
  // 投给画布容器，倍率换算成等效 deltaY（实测它一格 deltaY=±120 约合 1.1 倍）。
  // 走它的原生逻辑 = 沿用它的缩放范围（5%–1600%）、锚点与重绘时序。
  // ==========================================================================
  window.__hostZoomBy = (factor) => {
    try {
      const value = Number(factor);
      if (!Number.isFinite(value) || value <= 0 || Math.abs(value - 1) < 1e-6) {
        return false;
      }

      const canvas = frame().document.querySelector('.geDiagramContainer');
      if (!canvas) {
        return false;
      }

      const rect = canvas.getBoundingClientRect();
      canvas.dispatchEvent(new WheelEvent('wheel', {
        deltaX: 0,
        deltaY: -120 * Math.log(value) / Math.log(1.1),
        deltaMode: 0,
        ctrlKey: true,
        shiftKey: false,
        bubbles: true,
        cancelable: true,
        clientX: rect.left + rect.width / 2,
        clientY: rect.top + rect.height / 2,
      }));
      return true;
    } catch (e) {
      return false;
    }
  };
</script>
</body>
</html>
