<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Diagramon Excalidraw host</title>
<link rel="stylesheet" href="./index.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
  #root { position: absolute; inset: 0; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #888; font-size: 13px; }
  /* Excalidraw 自带的左下缩放控件（- / 重置 / +，容器类名 zoom-actions）与本应用的缩放
     语义重复，这里藏掉。**只能靠类名**：0.18.1 的 UIOptions 里没有 zoom 开关
     （canvasActions 只有 changeViewBackgroundColor / clearCanvas / export / loadScene /
     saveToActiveFile / toggleTheme / saveAsImage）。升级 Excalidraw 后要复核这个类名
     （版本 pin 在 tools/excalidraw.version）。隐藏 ≠ 删除：Ctrl+滚轮缩放照旧可用。 */
  .zoom-actions { display: none !important; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot"></div>
<script src="./offline-guard.js"></script>
<script>
  // 离线守卫（上一行）必须在 app.js 之前执行
  // **离线硬要求**：Excalidraw 默认把字体等资源解析到它的 CDN 回退地址
  // （esm.sh/@excalidraw/excalidraw@<ver>/dist/prod/…）。不设这个变量，画布会向公网取字体，
  // 离线包就破了（方案 §6.2 的同类问题）。指向本页所在目录，`dist/prod/fonts/**` 就按相对路径命中。
  window.EXCALIDRAW_ASSET_PATH = new URL("./", window.location.href).href;
</script>
<script src="./app.js"></script>
<script>
// ---------------------------------------------------------------------------
// 这是我们自己的承载页（Excalidraw 是**库型**集成：不需要 iframe，也不需要 postMessage 协议，
// 见方案 §12.4）。它做三件事：
//   1) 把 Excalidraw 挂到 #root；
//   2) 把画布变更（onChange）压进 window.__hostQueue，由 C# 侧轮询取走 —— 与 drawio 那条通道
//      形状一致（宿主只要能执行脚本就能工作，不依赖 WebView 包装层的事件）；
//   3) 暴露 window.__apply 供 C# 侧下发指令：setScene / loadMermaid / fit / getScene / export。
// 内容真相始终是标签页里的 JSON 文本；本页只负责视图与事件。
//
// **`files` 必须在场（2026-10-17 修）**：Excalidraw 的图片元素只存一个 `fileId`，真正的字节在
// 画布的 files 里。所以两个方向都要带上它，否则图片元素指向一个不存在的文件（画布上什么都没有）。
//
// ⚠️ 交附件的入口只有一个：**`api.addFiles(files)`**。
//    `api.updateScene({...})` 在 API 层**压根不认 `files` / `replaceFiles`**（实测：它只处理
//    elements / appState / collaborators，多给的字段被静默忽略）—— 往那里塞 files 看着像做了事，
//    其实什么都没发生。这条踩过，别再改回去。
//    `addFiles` 是**合并**语义（内部 addMissingFiles 不带 replaceFiles），没有"清空重设"的公开入口；
//    因此跨文档泄漏不靠清画布，而靠下面这条回报规则从根上避免。
//
// 回报规则：`report('scene', {elements, appState, files})`，`files` 只含**元素真正引用到的**那些
// （见 referencedFiles）—— 画布内存里可能还留着上一份文档的附件，但绝不会被写进这一份的正文。
// 也只在"被引用的 fileId 集合"变化时才带（内含 base64；Excalidraw 的文件按 id 不可变，集合够用）。
//
// 另注：`convertMermaid` 对不支持的语法（如 subgraph）会兜底成**一整张位图**，位图就在 `files` 里 ——
// 这条链断了的话，用户看到的就是一块空白画布。
// ---------------------------------------------------------------------------
(function () {
  // 承载页自产的可见文案（boot 覆盖层 + 失败横幅）：页面访问不到应用的语言表，
  // 由宿主在导航 URL 上带 `?lang=<code>`（见 ExcalidrawDocumentHost.EnsureNavigated）。
  // 认不出就按英文 —— 与 LocalizationService 的默认语言一致。
  const PAGE_TEXTS = {
    'zh-CN': {
      boot: '正在载入 Excalidraw…',
      mermaidFailed: 'Mermaid 转换失败: ',
      bundleMissing: 'Excalidraw bundle 未加载：缺少 window.ExcalidrawApp.mount',
      mountFailed: 'Excalidraw 挂载失败: '
    },
    'en-US': {
      boot: 'Loading Excalidraw…',
      mermaidFailed: 'Mermaid conversion failed: ',
      bundleMissing: 'Excalidraw bundle not loaded: window.ExcalidrawApp.mount is missing',
      mountFailed: 'Failed to mount Excalidraw: '
    }
  };
  const requested = (new URLSearchParams(window.location.search).get('lang') || '').toLowerCase();
  const T = requested.startsWith('zh') ? PAGE_TEXTS['zh-CN'] : PAGE_TEXTS['en-US'];

  const boot = document.getElementById('boot');
  if (boot) { boot.textContent = T.boot; }

  const out = {
    state: 'booting',
    queue: [],
    api: null,
    error: null
  };
  window.__hostState = out.state;
  window.__hostQueue = out.queue;
  window.__hostError = null;

  // 缩放比例回报（宿主每 150ms 轮询，见 EmbeddedProtocol.ZoomProbeScript）：
  // Excalidraw 的缩放是页面状态，直接问 API 即可；拿不到时返回 0，宿主按"没有新值"处理。
  window.__hostZoom = () => {
    try {
      const zoom = out.api ? out.api.getAppState().zoom : null;
      const value = zoom ? Number(zoom.value) : 0;
      return Number.isFinite(value) && value > 0 ? value : 0;
    } catch (e) {
      return 0;
    }
  };

  // --------------------------------------------------------------------------
  // 视口命令：应用级"放大 / 缩小 / 适应"落到 Excalidraw 时的实现。
  //
  // 缩放范围用 Excalidraw 自己的边界（0.1–30）；锚点取视口中心 —— 缩放前后视口中心对应的
  // 场景坐标不变，这也是它自己的 Ctrl+滚轮在做的事（只不过锚点是光标）。
  // --------------------------------------------------------------------------
  const MIN_ZOOM = 0.1;
  const MAX_ZOOM = 30;

  function applyZoom(factor) {
    const api = out.api;
    if (!api) {
      return false;
    }

    const value = Number(factor);
    if (!Number.isFinite(value) || value <= 0 || Math.abs(value - 1) < 1e-6) {
      return false;
    }

    const state = api.getAppState();
    const current = state.zoom && Number(state.zoom.value) > 0 ? Number(state.zoom.value) : 1;
    const target = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, current * value));
    if (Math.abs(target - current) < 1e-6) {
      return false;
    }

    const width = Number(state.width) || 0;
    const height = Number(state.height) || 0;
    const sceneCenterX = -Number(state.scrollX) + width / 2 / current;
    const sceneCenterY = -Number(state.scrollY) + height / 2 / current;

    api.updateScene({
      appState: {
        zoom: { value: target },
        scrollX: -(sceneCenterX - width / 2 / target),
        scrollY: -(sceneCenterY - height / 2 / target),
      },
    });
    return true;
  }

  window.__hostZoomBy = applyZoom;

  // --------------------------------------------------------------------------
  // 画布内的应用级快捷键转发（与 drawio 承载页同一张词汇表）。
  // 画布持有焦点时 Avalonia 窗口的 KeyBindings 收不到键；这里在捕获阶段截住命中的组合键，
  // 顺带拦住 Excalidraw 自己的同名绑定（它的 Ctrl+S 会把场景当文件下载）。
  // --------------------------------------------------------------------------
  function normalizeHotkey(event) {
    if (!event.ctrlKey || event.altKey || event.metaKey) {
      return null;
    }

    switch (event.key) {
      case 's': case 'S': return event.shiftKey ? 'ctrl+shift+s' : 'ctrl+s';
      case 'o': case 'O': return 'ctrl+o';
      case 'n': case 'N': return 'ctrl+n';
      case 'w': case 'W': return 'ctrl+w';
      case 'q': case 'Q': return 'ctrl+q';
      case '0': return 'ctrl+0';
      case '=': case '+': return 'ctrl+zoom-in';
      case '-': case '_': return 'ctrl+zoom-out';
      default: return null;
    }
  }

  window.addEventListener('keydown', (event) => {
    const combo = normalizeHotkey(event);
    if (!combo) {
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    report('hotkey', { combo: combo });
  }, true);

  function report(name, payload) {
    // 按属性重读并自愈：宿主取走消息时可能替换/清空这个数组，
    // 页面若持有旧引用，后续事件会静默丢失。
    if (!Array.isArray(window.__hostQueue)) { window.__hostQueue = []; }
    window.__hostQueue.push(JSON.stringify(Object.assign({ event: name }, payload || {})));
  }

  function fail(message) {
    out.error = String(message);
    window.__hostError = out.error;
    document.getElementById('boot').textContent = out.error;
    report('error', { message: out.error });
  }

  // C# → 页面
  // 挂载完成前收到的指令先排队：`Show()` 会在导航后立刻下发 setScene，
  // 而 Excalidraw 的挂载是异步的 —— 直接丢弃会让"打开文件"变成空白画布。
  const pendingCommands = [];

  function applyCommand(msg) {
    if (msg.action === 'setScene') {
      const scene = typeof msg.scene === 'string' ? JSON.parse(msg.scene) : msg.scene;
      messages.pending = scene;               // 记下最近一次外部载入，避免立刻回写成"用户修改"
      const elements = scene.elements || [];
      out.api.updateScene({ elements: elements, appState: scene.appState || {} });
      // 附件走 addFiles（updateScene 不认 files，见文件头）。文档自带的附件在这里交给画布。
      applyFiles(scene.files || {});
      window.__excalidrawApi = out.api;
      suppressEchoes(elements);
      ensureViewportVisible();                // 载入文档 = 视图由这份文档决定，不沿用上一份的视口
      return true;
    }

    if (msg.action === 'ensureVisible') {
      // 标签页重新激活时由宿主下发：视口若在内容之外（或空文档停在奇怪视口）就拉回来
      return ensureViewportVisible();
    }

    if (msg.action === 'fit') {
      // 应用级"适应视图"：把内容整体缩放到可见范围内（空文档则回到 100% + 原点，与 fitToViewport 同语义）
      const elements = visibleElements();
      if (elements.length === 0) {
        out.api.updateScene({ appState: { zoom: { value: 1 }, scrollX: 0, scrollY: 0 } });
        return true;
      }

      out.api.scrollToContent(elements, { fitToContent: true, animate: false });
      return true;
    }

    if (msg.action === 'loadMermaid') {
      return window.ExcalidrawApp.convertMermaid(msg.source).then(function (converted) {
        const elements = converted.elements || [];
        messages.pending = { elements: elements };
        out.api.updateScene({ elements: elements });
        // 同样走 addFiles；`converted.files` 一定要带到：上游对不支持的语法（如 subgraph）会
        // 兜底成**一整张位图**，位图就在 files 里 —— 漏了它，画布上只剩一个悬空 fileId 的 image 元素。
        applyFiles(converted.files || {});
        suppressEchoes(elements);
        ensureViewportVisible();
        report('loaded', { count: elements.length });
        return true;
      }).catch(function (e) {
        fail(T.mermaidFailed + (e && e.message ? e.message : e));
        return false;
      });
    }

    if (msg.action === 'getScene') {
      // 宿主主动要当前场景。为什么需要它：`scene` 事件只在**真实变更**时推
      // （外部 setScene / loadMermaid 之后被 suppressEchoes 挡掉），
      // 所以「转换拿结果」和「落盘前 flush」这两条路取不到东西。
      // 形状与 onChange 那条 report('scene') 保持一致，消费侧只认一种。
      // `files` 这里**必给**（主动要就是要一份完整可落盘的场景）；签名基线同步刷新，
      // 免得紧接着的 onChange 又把它重发一遍。
      const elements = out.api.getSceneElements();
      const files = referencedFiles(elements);
      filesSig = filesSignature(files);
      report('scene', {
        elements: elements,
        appState: filterAppState(out.api.getAppState()),
        files: files,
      });
      return true;
    }

    if (msg.action === 'export') {
      return window.ExcalidrawApp
        .exportPng({ scale: msg.scale || 2, transparent: msg.transparent !== false })
        .then(function (dataUri) { report('export', { format: 'png', data: dataUri }); return true; })
        .catch(function (e) { report('export', { format: 'png', data: null, message: String(e && e.message || e) }); return false; });
    }

    return false;
  }

  window.__apply = function (command) {
    let msg;
    try {
      msg = typeof command === 'string' ? JSON.parse(command) : command;
    } catch (e) {
      fail(e && e.message ? e.message : String(e));
      return false;
    }

    if (!out.api) {
      pendingCommands.push(msg);
      return false;
    }

    try {
      return applyCommand(msg);
    } catch (e) {
      fail(e && e.message ? e.message : String(e));
      return false;
    }
  };

  function flushPendingCommands() {
    while (pendingCommands.length > 0) {
      const msg = pendingCommands.shift();
      try { applyCommand(msg); } catch (e) { fail(e && e.message ? e.message : String(e)); }
    }
  }

  // 外部载入期间抑制回写：Excalidraw 的 onChange 在 updateScene 之后也会触发
  const messages = { pending: null, suppressUntil: 0 };

  // --------------------------------------------------------------------------
  // files 的搬运（见文件头注释）。
  //
  // `filesSig` = 最近一次回报过的"被引用附件"集合。用途只有一个：**别在每个 onChange 里重发 base64**。
  // Excalidraw 的文件按 id 不可变（同一 id 的内容不会改），所以集合相同就等于没变化。
  // --------------------------------------------------------------------------
  let filesSig = "";
  /** 最近一次交给画布的 files。只在 api 没暴露可枚举的 `getFiles` 时兜底用。 */
  let lastFiles = {};

  function filesSignature(files) {
    return Object.keys(files || {}).sort().join(",");
  }

  /** 画布当前持有的全部附件。api 还没起来 / 没暴露 getFiles 时回最近一次交进去的那份。 */
  function currentFiles() {
    try {
      if (out.api && typeof out.api.getFiles === 'function') {
        const files = out.api.getFiles();
        if (files && typeof files === 'object') {
          return files;
        }
      }
    } catch (e) {
      // 落到下面的兜底：宁可回上一份，也不要回"没有附件"——那等于把图丢了
    }
    return lastFiles || {};
  }

  /**
   * 把一份附件交给画布。
   *
   * **入口只能是 `api.addFiles`** —— `updateScene` 在 API 层不认 `files`（见文件头）。
   * 它是合并语义：同 id 已存在时**不会覆盖**（Excalidraw 的文件按 id 不可变，正常情况下不会撞）。
   */
  function applyFiles(files) {
    const incoming = files || {};
    if (!Object.keys(incoming).length) {
      return;                                  // 没有附件就别调，省一次不必要的重绘
    }
    lastFiles = incoming;
    if (out.api && typeof out.api.addFiles === 'function') {
      out.api.addFiles(incoming);
    }
  }

  /**
   * 元素**真正引用到**的附件（元素只存 fileId，字节要从画布的 files 里取）。
   *
   * 为什么不是直接把 `getFiles()` 整份回报：`addFiles` 是合并语义、没有公开的清空入口，
   * 所以画布内存里会留着上一份文档的附件。整份回报 = 把别的文档的图片写进这一份的正文
   * （文件里凭空多出一段 base64，还带隐私问题）。按"被引用"过滤，从根上不会发生。
   */
  function referencedFiles(elements) {
    const all = currentFiles();
    const out = {};
    (elements || []).forEach(function (e) {
      if (e && e.type === 'image' && e.fileId && all[e.fileId]) {
        out[e.fileId] = all[e.fileId];
      }
    });
    return out;
  }

  // 基线签名：最近一次"外部载入完成 / 已上报"的场景指纹。
  // 用途是挡掉两类**回声**：挂载完成时的空场景 onChange，以及外部 setScene 之后的再次触发 ——
  // 否则宿主会在"只是打开文件"时把标签页正文覆写成空场景（并标脏）。
  // 初值取空场景的签名：Excalidraw 挂载完成时会用空场景触发一次 onChange，
  // 那一次不是用户变更，绝不能回写（否则打开文件的瞬间正文就被清空）。
  let baseline = "[]";

  function sceneSignature(elements) {
    return JSON.stringify((elements || []).map(function (e) {
      return [e.id, e.version, e.versionNonce, e.isDeleted ? 1 : 0];
    }));
  }

  function setBaseline(elements) {
    baseline = sceneSignature(elements);
  }

  // 外部载入之后的"回声抑制窗口"：Excalidraw 收到 updateScene 后会**规范化**元素
  // （补 index、改 versionNonce/updated），规范化本身又会再触发一次 onChange。
  // 只在"第一次回声"上对齐基线是不够的 —— 那次对齐的是**入参**签名，规范化后的签名与它不同，
  // 于是第二次回声会被当成用户改动，把"只是打开文件"变成"已修改"。这里显式压住一小段时间，
  // 并在窗口结束时把基线重新对齐到画布**当前**的元素。
  const ECHO_SUPPRESS_MS = 900;

  function suppressEchoes(elements) {
    messages.pending = null;
    messages.suppressUntil = Date.now() + ECHO_SUPPRESS_MS;
    setBaseline(elements);

    setTimeout(function () {
      try {
        if (out.api) { setBaseline(out.api.getSceneElements()); }
      } catch (e) {
      }
      messages.suppressUntil = Date.now() + 150;
    }, ECHO_SUPPRESS_MS - 200);
  }

  function onCanvasChange(elements, appState) {
    const signature = sceneSignature(elements);

    if (messages.pending || Date.now() < messages.suppressUntil) {
      messages.pending = null;
      baseline = signature;
      return;
    }

    if (signature === baseline) {
      return;                                  // 与基线一致 → 不是真实变更
    }

    baseline = signature;
    const payload = { elements: elements, appState: filterAppState(appState) };
    // 被引用附件集合变了才带 files（典型场景：用户往画布上粘了一张图）。
    // 内容按 id 不可变 ⇒ 集合相同就是没变，不必每个 onChange 重发一遍 base64。
    const files = referencedFiles(elements);
    const sig = filesSignature(files);
    if (sig !== filesSig) {
      filesSig = sig;
      payload.files = files;
    }
    report('scene', payload);
  }

  function filterAppState(appState) {
    // 只留可持久化的少量字段，避免把瞬态（如选中/hover）写进文档
    return {
      viewBackgroundColor: appState.viewBackgroundColor,
      gridSize: appState.gridSize,
      currentItemStrokeColor: appState.currentItemStrokeColor,
      currentItemBackgroundColor: appState.currentItemBackgroundColor
    };
  }

  // --------------------------------------------------------------------------
  // 视口归一化。
  //
  // 背景：文档里只存上面那 4 个 appState 字段 —— **不含 zoom / scrollX / scrollY**。
  // 也就是说视口是**页面级瞬态**，不随文档走。于是当画布被缩放/平移到一个看不到内容的位置
  // （或空文档被缩放到 412% 之类）时，切到别的标签页再切回来、或把这份文档重新载入，
  // 页面会原样保留那个视口 —— 用户看到的就是"一片纯白 + Scroll back to content"，
  // 而文档本身毫发无损。这里把它变成确定性行为：
  //   空场景            → 100% + 原点（没有内容可看，任何其它视口都只是噪声）
  //   有内容但视口看不到 → 拉回内容（保留当前缩放，与 Excalidraw 打开文件的行为一致）
  //   看得到内容        → 一律不动（尊重用户自己的视角）
  // --------------------------------------------------------------------------
  function visibleElements() {
    try {
      return (out.api.getSceneElements() || []).filter(function (e) { return e && !e.isDeleted; });
    } catch (e) {
      return [];
    }
  }

  function sceneContentBounds(elements) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    elements.forEach(function (e) {
      const x = Number(e.x), y = Number(e.y);
      if (!isFinite(x) || !isFinite(y)) { return; }
      const w = isFinite(Number(e.width)) ? Number(e.width) : 0;
      const h = isFinite(Number(e.height)) ? Number(e.height) : 0;
      minX = Math.min(minX, x); minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + h);
    });
    if (!isFinite(minX)) { return null; }
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  function viewportSceneBounds() {
    const st = out.api.getAppState() || {};
    const zoom = st.zoom && isFinite(Number(st.zoom.value)) && Number(st.zoom.value) > 0 ? Number(st.zoom.value) : 1;
    const w = isFinite(Number(st.width)) ? Number(st.width) : 0;
    const h = isFinite(Number(st.height)) ? Number(st.height) : 0;
    const scrollX = isFinite(Number(st.scrollX)) ? Number(st.scrollX) : 0;
    const scrollY = isFinite(Number(st.scrollY)) ? Number(st.scrollY) : 0;
    return { minX: -scrollX, minY: -scrollY, maxX: -scrollX + w / zoom, maxY: -scrollY + h / zoom };
  }

  function intersects(a, b) {
    return a.minX <= b.maxX && b.minX <= a.maxX && a.minY <= b.maxY && b.minY <= a.maxY;
  }

  function ensureViewportVisible() {
    if (!out.api) { return 'no-api'; }

    const elements = visibleElements();
    if (elements.length === 0) {
      out.api.updateScene({ appState: { zoom: { value: 1 }, scrollX: 0, scrollY: 0 } });
      return 'reset';
    }

    const content = sceneContentBounds(elements);
    if (!content) { return 'no-bounds'; }

    if (intersects(viewportSceneBounds(), content)) {
      return 'kept';
    }

    try {
      out.api.scrollToContent(elements, { fitToContent: false, animate: false });
    } catch (e) {
      return 'scroll-failed';
    }
    return 'scrolled';
  }

  const ready = window.ExcalidrawApp && typeof window.ExcalidrawApp.mount === 'function';
  if (!ready) {
    fail(T.bundleMissing);
    return;
  }

  Promise.resolve(window.ExcalidrawApp.mount(document.getElementById('root'), onCanvasChange))
    .then(function (api) {
      out.api = api;
      out.state = 'ready';
      window.__hostState = 'ready';
      window.__excalidrawApi = api;
      document.getElementById('boot').style.display = 'none';
      report('ready');
      flushPendingCommands();
    })
    .catch(function (e) {
      fail(T.mountFailed + (e && e.message ? e.message : e));
    });
})();
</script>
</body>
</html>
