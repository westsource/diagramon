# Diagramon dev2.0 —— Rust + Tauri 2 跨平台重写（Windows / macOS / Linux）
#
# 本工作区与同目录下的 Avalonia 客户端（Diagramon.csproj 等）并存，
# 迁移完成前旧实现保留为行为参照。工程结构对齐《迁移方案 v1.2》§7.5。
[workspace]
resolver = "2"
members = [
    "crates/app-ipc",
    "crates/app-core",
    "crates/assets",
    "crates/ai",
    "crates/platform",
    "crates/platform-windows",
    "src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/westsource/diagramon"

[workspace.dependencies]
app-ipc = { path = "crates/app-ipc" }
app-core = { path = "crates/app-core" }
assets = { path = "crates/assets" }
ai = { path = "crates/ai" }
platform = { path = "crates/platform" }
platform-windows = { path = "crates/platform-windows" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 开发构建：只保留行号表（panic 回溯里仍有 文件:行），丢掉类型/变量/字符串那几百 MB。
# 实测本机：完整 DWARF 下 debug 产物 265 MB（其中 .debug_* 约 184 MB）；
# windows-gnu 上 `split-debuginfo` 不生效（不会拆出旁挂文件），所以只能这样减。
# 需要单步调试变量时，临时改成 `debug = true` 再构建即可。
[profile.dev]
debug = "line-tables-only"
