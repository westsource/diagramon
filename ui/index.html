<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="normal" data-accent="pine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP（审计 F-2b）：这是挂 __TAURI__ 与渲染产物的那个文档，值得有一道内容安全策略。
     script-src 不含 'unsafe-inline' —— 内联脚本已全部外置（js/graphviz-loader.js）；
     'wasm-unsafe-eval' 给 graphviz / D2 的 wasm；connect-src 里的 ipc.localhost 是
     Tauri 2 在 Windows 上的 invoke 通道，data: 给"复制图片"时对 dataURL 的 fetch。
     样式要 'unsafe-inline'：界面模板里大量 style="…" 属性（fmtDot / 缩放列等）。
     注意：drawio / Excalidraw 承载页是各自独立的文档，本 meta 管不到它们 ——
     它们与外壳同源、同样摸得到 __TAURI__，那是"承载域分离"的架构项（见审计报告）。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: http://ipc.localhost https://ipc.localhost; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'">
<title>Diagramon</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="workbench" id="workbench">

  <!-- ══ 标题栏（自定义标题栏：decorations:false，根节点带 data-tauri-drag-region） ══ -->
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="brand">
      <span class="logo" data-tauri-drag-region><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-logo"></use></svg></span>
      <span class="brand-name" data-tauri-drag-region>Diagramon AI</span>
      <span class="brand-ver" id="brand-ver" data-tauri-drag-region hidden><!-- 真实版本，shell 由 app_info 填 --></span>
      <span class="mock-badge" id="mock-badge" hidden data-i18n="mock.badge" data-i18n-title="mock.title" title="未检测到 Tauri 运行时，已切到内置 mock 后端"></span>
    </div>

    <nav class="titlebar-menu" id="menubar"><!-- JS 渲染 --></nav>

    <div class="titlebar-center" data-tauri-drag-region>
      <div class="doc-title" id="doc-title"><!-- JS 渲染 --></div>
    </div>

    <div class="titlebar-actions">
      <button class="icon-btn" id="btn-cmd" data-i18n-title="ui.cmdPalette" title="命令面板  Ctrl+Shift+P"><svg class="ico"><use href="#i-bolt"></use></svg></button>
      <button class="icon-btn" id="btn-theme" data-i18n-title="ui.theme" title="切换明暗主题  Ctrl+K Ctrl+T"><svg class="ico"><use href="#i-moon"></use></svg></button>
      <button class="icon-btn" id="btn-layout" data-i18n-title="ui.layout" title="自定义布局"><svg class="ico"><use href="#i-layout"></use></svg></button>
      <div class="win-btns" id="win-btns">
        <button class="win-btn" id="win-min" data-i18n-title="ui.minimize" title="最小化"><svg class="ico ico-sm"><use href="#i-minimize"></use></svg></button>
        <button class="win-btn" id="win-max" data-i18n-title="ui.maximize" title="最大化"><svg class="ico ico-sm"><use href="#i-maximize"></use></svg></button>
        <button class="win-btn close" id="win-close" data-i18n-title="ui.close" title="关闭"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
      </div>
    </div>
  </header>

  <!-- ══ 主体：活动栏 / 侧栏 / 编辑区 / AI 面板 ══ -->
  <div class="body-row" id="body-row">

    <nav class="activitybar" id="activitybar"><!-- JS 渲染 --></nav>

    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span id="side-title">资源管理器</span>
        <span class="sp"></span>
        <button class="icon-btn" id="side-more" data-i18n-title="ui.more" title="更多操作"><svg class="ico ico-sm"><use href="#i-more"></use></svg></button>
        <button class="icon-btn" id="side-close" data-i18n-title="ui.hideSidebar" title="隐藏侧栏  Ctrl+B"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
      </div>
      <div class="side-view" id="side-view"><!-- JS 渲染 --></div>
    </aside>

    <!-- 侧栏宽度拖拽把手（无侧栏时由 CSS 隐藏） -->
    <div class="v-gutter" id="sidebar-gutter" data-i18n-title="ui.resizeSidebar" title="拖动调整侧栏宽度"></div>

    <main class="editor-col" id="editor-col">
      <div class="tabbar" id="tabbar">
        <div class="tabs" id="tabs"><!-- JS 渲染 --></div>
        <button class="tab-add" id="tab-add" data-i18n-title="ui.newTab" title="新建图表  Ctrl+N"><svg class="ico ico-sm"><use href="#i-plus"></use></svg></button>
        <div class="tabbar-right">
          <div class="viewmodes" id="viewmodes" role="group" data-i18n-aria-label="ui.viewMode" aria-label="视图模式"><!-- JS 渲染 --></div>
          <button class="icon-btn tab-conv" id="tab-convert" data-i18n-title="mi.convertTo" title="转换为"><svg class="ico ico-sm"><use href="#i-swap"></use></svg><span data-i18n="conv.title">转换</span></button>
          <button class="icon-btn" id="tab-more" data-i18n-title="ui.tabActions" title="标签页操作"><svg class="ico ico-sm"><use href="#i-more"></use></svg></button>
        </div>
      </div>

      <div class="fs-banner" id="fs-banner" hidden><!-- 外部改动与未保存冲突时由 shell 渲染 --></div>
      <div class="split mode-split" id="split">
        <section class="pane pane-source" id="pane-source">
          <div class="pane-head">
            <span class="lbl" id="src-lang">Mermaid</span>
            <span class="sp"></span>
            <button class="mini-btn" id="btn-format" data-i18n-title="ui.formatSource" title="格式化源码"><svg class="ico ico-sm"><use href="#i-wand"></use></svg><span data-i18n="src.format">格式化</span></button>
            <button class="mini-btn" id="btn-find" data-i18n-title="ui.find" title="查找替换  Ctrl+F"><svg class="ico ico-sm"><use href="#i-search"></use></svg></button>
            <button class="mini-btn" id="btn-src-ai" data-i18n-title="ui.aiThis" title="让 AI 改这段"><svg class="ico ico-sm"><use href="#i-sparkles"></use></svg>AI</button>
            <button class="mini-btn" id="btn-hide-source" data-i18n-title="ui.hideSource" title="隐藏源码窗口  Ctrl+3"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
          </div>
          <div class="code-scroll" id="code-scroll">
            <div class="code-host" id="editor-host"><!-- CodeMirror 挂载点 --></div>
          </div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" data-i18n-title="ui.resizeSplit" title="拖动调整比例"></div>

        <section class="pane pane-preview" id="pane-preview">
          <div class="pane-head">
            <span class="lbl">预览</span>
            <span class="pane-sub" id="preview-sub"></span>
            <span class="sp"></span>
            <!-- 渲染选项控件（Mermaid：外观+布局 / DOT·D2：布局）；由 preview.js 按格式显隐 -->
            <span id="pv-opts" style="display:contents"></span>
            <button class="mini-btn" id="btn-explain" data-i18n-title="ui.explain" title="解图  Ctrl+Shift+E"><svg class="ico ico-sm"><use href="#i-diagram"></use></svg></button>
            <button class="mini-btn" id="btn-show-source" data-i18n-title="ui.showSource" title="显示源码窗口  Ctrl+1"><svg class="ico ico-sm"><use href="#i-code"></use></svg></button>
            <button class="mini-btn" id="btn-copy-img" data-i18n-title="preview.copyTip" title="复制图片"><svg class="ico ico-sm"><use href="#i-copy"></use></svg></button>
            <button class="mini-btn" id="btn-export" data-i18n-title="preview.exportTip" title="导出图片"><svg class="ico ico-sm"><use href="#i-download"></use></svg></button>
          </div>
          <div class="canvas-viewport" id="canvas-viewport">
            <div class="canvas-stage" id="canvas-stage"><!-- JS 渲染 --></div>
            <!-- 画布型格式的承载面（drawio / Excalidraw 的同源 iframe，由 canvas.js 管理） -->
            <div class="canvas-host" id="canvas-host" hidden></div>
            <!-- 画布浮动工具组：缩放（居右，右缘与画布右缘 12px 对齐）；复制/导出已上移到顶栏 -->
            <div class="canvas-tools" id="canvas-tools">
              <div class="row">
                <div class="zoom-pill">
                  <button id="zoom-out" data-i18n-title="ui.zoomOut" title="缩小  Ctrl+-"><svg class="ico ico-sm"><use href="#i-zoomOut"></use></svg></button>
                  <span class="val" id="zoom-val">100%</span>
                  <button id="zoom-in" data-i18n-title="ui.zoomIn" title="放大  Ctrl+="><svg class="ico ico-sm"><use href="#i-zoomIn"></use></svg></button>
                  <button id="zoom-fit" data-i18n-title="ui.fit" title="适应视图  Ctrl+0"><svg class="ico ico-sm"><use href="#i-fit"></use></svg></button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 欢迎页（无标签时） -->
      <div class="welcome" id="welcome" hidden><!-- JS 渲染 --></div>

      <!-- 底部面板 -->
      <div class="panel-resizer" id="panel-resizer" data-i18n-title="ui.resizePanel" title="拖动调整高度"></div>
      <section class="bottom-panel" id="bottom-panel">
        <div class="bp-tabs" id="bp-tabs"><!-- JS 渲染 --></div>
        <div class="bp-body" id="bp-body"><!-- JS 渲染 --></div>
      </section>
    </main>

    <!-- AI 面板宽度拖拽把手（无 AI 面板时由 CSS 隐藏） -->
    <div class="v-gutter" id="ai-gutter" data-i18n-title="ui.resizeAi" title="拖动调整 AI 面板宽度"></div>

    <!-- AI 面板（第一公民） -->
    <aside class="ai-pane" id="ai-pane">
      <div class="ai-head">
        <span class="ai-title"><svg class="ico"><use href="#i-sparkles"></use></svg>AI</span>
        <span class="sp"></span>
        <button class="ai-model" id="ai-model" data-i18n-title="ui.model" title="切换模型档位">
          <span class="dot"></span><span id="ai-model-name">未配置</span>
          <svg class="ico ico-sm"><use href="#i-chevD"></use></svg>
        </button>
        <button class="icon-btn" id="ai-history" data-i18n-title="ui.history" title="历史会话"><svg class="ico ico-sm"><use href="#i-history"></use></svg></button>
        <button class="icon-btn" id="ai-clear" data-i18n-title="ui.clearChat" title="清空对话"><svg class="ico ico-sm"><use href="#i-trash"></use></svg></button>
        <button class="icon-btn" id="ai-close" data-i18n-title="ui.hideAi" title="隐藏 AI 面板  Ctrl+Shift+A"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
      </div>

      <div class="ai-memory-bar" id="ai-memory-bar" hidden><!-- JS 渲染：待确认的记忆候选 --></div>

      <div class="ai-stream" id="ai-stream"><!-- JS 渲染 --></div>

      <div class="ai-suggest" id="ai-suggest"><!-- JS 渲染 --></div>

      <div class="ai-composer">
        <div class="ai-attachments" id="ai-attachments" hidden></div>
        <div class="ai-box">
          <textarea id="ai-input" rows="2" placeholder="描述你想要的图，Enter 发送 / Shift+Enter 换行"></textarea>
          <div class="ai-box-row ai-tools-row">
            <button class="icon-btn" id="ai-attach" data-i18n-title="ui.attachImage" title="添加图片（识图）"><svg class="ico ico-sm"><use href="#i-image"></use></svg></button>
            <button class="icon-btn" id="ai-screenshot" data-i18n-title="ui.capture" title="截取屏幕区域识别"><svg class="ico ico-sm"><use href="#i-scan"></use></svg></button>
            <button class="icon-btn" id="ai-context" data-i18n-title="ui.useDoc" title="把当前图作为上下文"><svg class="ico ico-sm"><use href="#i-diagram"></use></svg></button>
            <!-- 选文件加入上下文（可多选）；也可以直接把文件**拖进这个面板**（原生拖放，见 ai.js::handleDrop） -->
            <button class="icon-btn" id="ai-file-pick" data-i18n-title="ai.filePick" title="选择文件作为上下文"><svg class="ico ico-sm"><use href="#i-folder"></use></svg></button>
            <span class="sp"></span>
            <span class="ai-hint" id="ai-hint"></span>
          </div>
          <div class="ai-box-row ai-intent-row">
            <div class="intent-wrap">
              <div class="intent-slider auto" id="ai-intent-slider" role="radiogroup" aria-label="本条意图">
                <span class="thumb"></span>
                <button data-intent="generate" role="radio" aria-checked="false" data-i18n-title="ai.intent.generate" title="生图" data-i18n="ai.intent.generate">生图</button>
                <button data-intent="vision" role="radio" aria-checked="false" data-i18n-title="ai.intent.vision" title="识图" data-i18n="ai.intent.vision">识图</button>
                <button data-intent="review" role="radio" aria-checked="false" data-i18n-title="ai.intent.review" title="改图" data-i18n="ai.intent.review">改图</button>
                <button data-intent="explain" role="radio" aria-checked="false" data-i18n-title="ai.intent.explain" title="解图" data-i18n="ai.intent.explain">解图</button>
              </div>
              <button class="intent-auto on" id="ai-intent-auto" title="自动判断"><span class="dot"></span><span id="ai-intent-auto-label" data-i18n="ai.intent.auto">自动</span><span class="pct" id="ai-intent-conf"></span></button>
            </div>
            <span class="sp"></span>
            <select class="out-format" id="ai-out-format" title="输出格式；与当前文档不同时，应用会新建对应格式的标签页">
              <option value="follow" data-i18n="ai.output.follow">跟随当前</option>
              <option value="mermaid" data-i18n="ai.output.mermaid">Mermaid</option>
              <option value="dot" data-i18n="ai.output.dot">Graphviz DOT</option>
              <option value="d2" data-i18n="ai.output.d2">D2</option>
              <option value="drawio-via" data-i18n="ai.output.drawio">drawio（经转换）</option>
              <option value="excalidraw-via" data-i18n="ai.output.excalidraw">Excalidraw（经转换）</option>
            </select>
            <button class="send-btn" id="ai-send" data-i18n-title="ui.send" title="发送  Enter"><svg class="ico ico-sm"><use href="#i-send"></use></svg></button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- ══ 状态栏 ══ -->
  <footer class="statusbar" id="statusbar"><!-- JS 渲染 --></footer>
</div>

<!-- ══ 弹层容器 ══ -->
<div class="overlay" id="overlay-palette" hidden>
  <div class="palette" role="dialog" data-i18n-aria-label="ui.palette" aria-label="命令面板">
    <div class="palette-input">
      <svg class="ico dim"><use href="#i-bolt"></use></svg>
      <input id="palette-input" type="text" data-i18n-placeholder="ui.palettePh" placeholder="输入命令、格式或问题…" autocomplete="off" spellcheck="false">
      <span class="kbd-inline">Esc</span>
    </div>
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot">
      <span data-i18n="palette.nav">↑↓ 选择</span><span data-i18n="palette.run">Enter 执行</span><span data-i18n="palette.prefix">前缀 &gt; 命令 · ? 帮助</span><span id="palette-count"></span>
    </div>
  </div>
</div>

<div class="overlay center" id="overlay-dialog" hidden>
  <div class="dialog" id="dialog" role="dialog"><!-- JS 渲染 --></div>
</div>

<div class="pop" id="pop" hidden></div>
<div class="pop sub" id="pop-sub" hidden></div>
<div class="toasts" id="toasts"></div>

<input type="file" id="file-input" accept="image/*,.*" hidden>
<input type="file" id="ai-image-file" accept="image/*" hidden>

<!-- ══ 厂商脚本（charset 必须显式声明：file:// 下浏览器不继承文档 charset，
        含非 ASCII 的 mermaid.min.js 会被误码成语法错误） ══ -->
<script charset="utf-8" src="./vendor/mermaid.min.js"></script>
<script charset="utf-8" src="./vendor/editor.bundle.js"></script>
<!-- graphviz 预载：原内联 module 已外置（CSP script-src 'self' 不放行内联脚本） -->
<script type="module" src="./js/graphviz-loader.js"></script>

<!-- ══ 应用脚本（顺序即依赖；charset 同上） ══ -->
<script charset="utf-8" src="./js/icons.js"></script>
<script charset="utf-8" src="./js/i18n.js"></script>
<script charset="utf-8" src="./js/ipc.js"></script>
<script charset="utf-8" src="./js/state.js"></script>
<script charset="utf-8" src="./js/shell.js"></script>
<script charset="utf-8" src="./js/markdown.js"></script>
<script charset="utf-8" src="./js/palette.js"></script>
<script charset="utf-8" src="./js/sidebar.js"></script>
<script charset="utf-8" src="./js/panels.js"></script>
<script charset="utf-8" src="./js/tabs.js"></script>
<script charset="utf-8" src="./js/editor.js"></script>
<script charset="utf-8" src="./js/canvas.js"></script>
<script charset="utf-8" src="./js/d2.js"></script>
<script charset="utf-8" src="./js/preview.js"></script>
<script charset="utf-8" src="./js/validate.js"></script>
<script charset="utf-8" src="./js/reconcile.js"></script>
<script charset="utf-8" src="./js/ai.js"></script>
<script charset="utf-8" src="./js/enhance.js"></script>
<script charset="utf-8" src="./js/dialogs.js"></script>
<script charset="utf-8" src="./js/cloud.js"></script>
<script charset="utf-8" src="./js/main.js"></script>
</body>
</html>
