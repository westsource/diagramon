<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="normal" data-accent="pine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagramon</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="workbench" id="workbench">

  <!-- ══ 标题栏（自定义标题栏：decorations:false，根节点带 data-tauri-drag-region） ══ -->
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="brand">
      <span class="logo" data-tauri-drag-region><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-logo"></use></svg></span>
      <span class="brand-name" data-tauri-drag-region>Diagramon</span>
      <span class="brand-ver" id="brand-ver" data-tauri-drag-region>dev3.0</span>
      <span class="mock-badge" id="mock-badge" hidden title="未检测到 Tauri 运行时，已切到内置 mock 后端"></span>
    </div>

    <nav class="titlebar-menu" id="menubar"><!-- JS 渲染 --></nav>

    <div class="titlebar-center" data-tauri-drag-region>
      <div class="doc-title" id="doc-title"><!-- JS 渲染 --></div>
    </div>

    <div class="titlebar-actions">
      <button class="icon-btn" id="btn-cmd" title="命令面板  Ctrl+Shift+P"><svg class="ico"><use href="#i-bolt"></use></svg></button>
      <button class="icon-btn" id="btn-theme" title="切换明暗主题  Ctrl+K Ctrl+T"><svg class="ico"><use href="#i-moon"></use></svg></button>
      <button class="icon-btn" id="btn-layout" title="自定义布局"><svg class="ico"><use href="#i-layout"></use></svg></button>
      <div class="win-btns" id="win-btns">
        <button class="win-btn" id="win-min" title="最小化"><svg class="ico ico-sm"><use href="#i-minimize"></use></svg></button>
        <button class="win-btn" id="win-max" title="最大化"><svg class="ico ico-sm"><use href="#i-maximize"></use></svg></button>
        <button class="win-btn close" id="win-close" title="关闭"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
      </div>
    </div>
  </header>

  <!-- ══ 主体：活动栏 / 侧栏 / 编辑区 / AI 面板 ══ -->
  <div class="body-row" id="body-row">

    <nav class="activitybar" id="activitybar"><!-- JS 渲染 --></nav>

    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span id="side-title">资源管理器</span>
        <span class="sp"></span>
        <button class="icon-btn" id="side-more" title="更多操作"><svg class="ico ico-sm"><use href="#i-more"></use></svg></button>
        <button class="icon-btn" id="side-close" title="隐藏侧栏  Ctrl+B"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
      </div>
      <div class="side-view" id="side-view"><!-- JS 渲染 --></div>
    </aside>

    <main class="editor-col" id="editor-col">
      <div class="tabbar" id="tabbar">
        <div class="tabs" id="tabs"><!-- JS 渲染 --></div>
        <button class="tab-add" id="tab-add" title="新建图表  Ctrl+N"><svg class="ico ico-sm"><use href="#i-plus"></use></svg></button>
        <div class="tabbar-right">
          <div class="viewmodes" id="viewmodes" role="group" aria-label="视图模式"><!-- JS 渲染 --></div>
          <button class="icon-btn" id="tab-more" title="标签页操作"><svg class="ico ico-sm"><use href="#i-more"></use></svg></button>
        </div>
      </div>

      <div class="split mode-split" id="split">
        <section class="pane pane-source" id="pane-source">
          <div class="pane-head">
            <span class="lbl" id="src-lang">Mermaid</span>
            <span class="sp"></span>
            <button class="mini-btn" id="btn-format" title="格式化源码"><svg class="ico ico-sm"><use href="#i-wand"></use></svg><span data-i18n="src.format">格式化</span></button>
            <button class="mini-btn" id="btn-find" title="查找替换  Ctrl+F"><svg class="ico ico-sm"><use href="#i-search"></use></svg></button>
            <button class="mini-btn" id="btn-src-ai" title="让 AI 改这段"><svg class="ico ico-sm"><use href="#i-sparkles"></use></svg>AI</button>
            <button class="mini-btn" id="btn-hide-source" title="隐藏源码窗口  Ctrl+3"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
          </div>
          <div class="code-scroll" id="code-scroll">
            <div class="code-host" id="editor-host"><!-- CodeMirror 挂载点 --></div>
          </div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="拖动调整比例"></div>

        <section class="pane pane-preview" id="pane-preview">
          <div class="pane-head">
            <span class="lbl">预览</span>
            <span class="pane-sub" id="preview-sub"></span>
            <span class="sp"></span>
            <button class="mini-btn" id="btn-convert" title="转换到其他格式"><svg class="ico ico-sm"><use href="#i-swap"></use></svg><span data-i18n="conv.title">转换</span></button>
            <button class="mini-btn" id="btn-fit" title="适应视图  Ctrl+0"><svg class="ico ico-sm"><use href="#i-fit"></use></svg></button>
            <button class="mini-btn" id="btn-show-source" title="显示源码窗口  Ctrl+1"><svg class="ico ico-sm"><use href="#i-code"></use></svg></button>
          </div>
          <div class="canvas-viewport" id="canvas-viewport">
            <div class="canvas-stage" id="canvas-stage"><!-- JS 渲染 --></div>
            <!-- 画布型格式的承载面（drawio / Excalidraw 的同源 iframe，由 canvas.js 管理） -->
            <div class="canvas-host" id="canvas-host" hidden></div>
            <div class="zoom-pill">
              <button id="zoom-out" title="缩小  Ctrl+-"><svg class="ico ico-sm"><use href="#i-zoomOut"></use></svg></button>
              <span class="val" id="zoom-val">100%</span>
              <button id="zoom-in" title="放大  Ctrl+="><svg class="ico ico-sm"><use href="#i-zoomIn"></use></svg></button>
              <button id="zoom-fit" title="适应视图  Ctrl+0"><svg class="ico ico-sm"><use href="#i-fit"></use></svg></button>
            </div>
            <div class="canvas-tools" id="canvas-tools">
              <div class="row">
                <button class="fab" id="btn-copy-img" title="复制为图片到剪贴板"><svg class="ico ico-sm"><use href="#i-copy"></use></svg>复制图片</button>
                <button class="fab" id="btn-export" title="导出 PNG / SVG"><svg class="ico ico-sm"><use href="#i-download"></use></svg>导出</button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 欢迎页（无标签时） -->
      <div class="welcome" id="welcome" hidden><!-- JS 渲染 --></div>

      <!-- 底部面板 -->
      <div class="panel-resizer" id="panel-resizer" title="拖动调整高度"></div>
      <section class="bottom-panel" id="bottom-panel">
        <div class="bp-tabs" id="bp-tabs"><!-- JS 渲染 --></div>
        <div class="bp-body" id="bp-body"><!-- JS 渲染 --></div>
      </section>
    </main>

    <!-- AI 面板（第一公民） -->
    <aside class="ai-pane" id="ai-pane">
      <div class="ai-head">
        <span class="ai-title"><svg class="ico"><use href="#i-sparkles"></use></svg>AI</span>
        <span class="sp"></span>
        <button class="ai-model" id="ai-model" title="切换模型档位">
          <span class="dot"></span><span id="ai-model-name">未配置</span>
          <svg class="ico ico-sm"><use href="#i-chevD"></use></svg>
        </button>
        <button class="icon-btn" id="ai-history" title="历史会话"><svg class="ico ico-sm"><use href="#i-history"></use></svg></button>
        <button class="icon-btn" id="ai-clear" title="清空对话"><svg class="ico ico-sm"><use href="#i-trash"></use></svg></button>
        <button class="icon-btn" id="ai-close" title="隐藏 AI 面板  Ctrl+Shift+A"><svg class="ico ico-sm"><use href="#i-close"></use></svg></button>
      </div>

      <div class="ai-tabs" id="ai-tabs">
        <button class="ai-tab on" data-ai="chat" data-i18n="ai.tab.chat">对话生成</button>
        <button class="ai-tab" data-ai="vision" data-i18n="ai.tab.vision">识图</button>
        <button class="ai-tab" data-ai="review" data-i18n="ai.tab.review">改图</button>
      </div>

      <div class="ai-stream" id="ai-stream"><!-- JS 渲染 --></div>

      <div class="ai-suggest" id="ai-suggest"><!-- JS 渲染 --></div>

      <div class="ai-composer">
        <div class="ai-attachments" id="ai-attachments" hidden></div>
        <div class="ai-box">
          <textarea id="ai-input" rows="2" placeholder="描述你想要的图，Enter 发送 / Shift+Enter 换行"></textarea>
          <div class="ai-box-row">
            <button class="icon-btn" id="ai-attach" title="添加图片（识图）"><svg class="ico ico-sm"><use href="#i-image"></use></svg></button>
            <button class="icon-btn" id="ai-screenshot" title="截取屏幕区域识别"><svg class="ico ico-sm"><use href="#i-scan"></use></svg></button>
            <button class="icon-btn" id="ai-context" title="把当前图作为上下文"><svg class="ico ico-sm"><use href="#i-diagram"></use></svg></button>
            <span class="sp"></span>
            <span class="ai-hint" id="ai-hint"></span>
            <button class="send-btn" id="ai-send" title="发送  Enter"><svg class="ico ico-sm"><use href="#i-send"></use></svg></button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- ══ 状态栏 ══ -->
  <footer class="statusbar" id="statusbar"><!-- JS 渲染 --></footer>
</div>

<!-- ══ 弹层容器 ══ -->
<div class="overlay" id="overlay-palette" hidden>
  <div class="palette" role="dialog" aria-label="命令面板">
    <div class="palette-input">
      <svg class="ico dim"><use href="#i-bolt"></use></svg>
      <input id="palette-input" type="text" placeholder="输入命令、格式或问题…" autocomplete="off" spellcheck="false">
      <span class="kbd-inline">Esc</span>
    </div>
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot">
      <span data-i18n="palette.nav">↑↓ 选择</span><span data-i18n="palette.run">Enter 执行</span><span data-i18n="palette.prefix">前缀 &gt; 命令 · ? 帮助</span><span id="palette-count"></span>
    </div>
  </div>
</div>

<div class="overlay center" id="overlay-dialog" hidden>
  <div class="dialog" id="dialog" role="dialog"><!-- JS 渲染 --></div>
</div>

<div class="pop" id="pop" hidden></div>
<div class="pop sub" id="pop-sub" hidden></div>
<div class="toasts" id="toasts"></div>

<input type="file" id="file-input" accept="image/*,.*" hidden>
<input type="file" id="ai-image-file" accept="image/*" hidden>

<!-- ══ 厂商脚本（charset 必须显式声明：file:// 下浏览器不继承文档 charset，
        含非 ASCII 的 mermaid.min.js 会被误码成语法错误） ══ -->
<script charset="utf-8" src="./vendor/mermaid.min.js"></script>
<script charset="utf-8" src="./vendor/editor.bundle.js"></script>
<script type="module">
  // graphviz 是 ESM：file:// 下浏览器的模块加载被 CORS 拦截（origin null），
  // 只有 Tauri 自定义协议 / http(s) 里才可用。失败时降级为「不可用」，不阻断整页。
  window.DGMGraphvizReady = (async () => {
    try {
      const mod = await import("./vendor/graphviz.js");
      const g = await mod.Graphviz.load();
      window.DGMGraphviz = g;
      return g;
    } catch (e) {
      window.DGMGraphvizError = (e && e.message) || String(e);
      console.warn("[DGM] graphviz 加载失败（DOT 预览不可用）：", window.DGMGraphvizError);
      return null;
    }
  })();
</script>

<!-- ══ 应用脚本（顺序即依赖；charset 同上） ══ -->
<script charset="utf-8" src="./js/icons.js"></script>
<script charset="utf-8" src="./js/i18n.js"></script>
<script charset="utf-8" src="./js/ipc.js"></script>
<script charset="utf-8" src="./js/state.js"></script>
<script charset="utf-8" src="./js/shell.js"></script>
<script charset="utf-8" src="./js/palette.js"></script>
<script charset="utf-8" src="./js/sidebar.js"></script>
<script charset="utf-8" src="./js/panels.js"></script>
<script charset="utf-8" src="./js/tabs.js"></script>
<script charset="utf-8" src="./js/editor.js"></script>
<script charset="utf-8" src="./js/canvas.js"></script>
<script charset="utf-8" src="./js/preview.js"></script>
<script charset="utf-8" src="./js/ai.js"></script>
<script charset="utf-8" src="./js/dialogs.js"></script>
<script charset="utf-8" src="./js/main.js"></script>
</body>
</html>
